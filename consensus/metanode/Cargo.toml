[package]
name = "metanode"
version = "0.9.42"
edition = "2021"
authors = ["MetaNode Team"]
license = "Apache-2.0"

[lib]
name = "metanode"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
dashmap = "5.5.3"
tracing-appender = "0.2"
# Meta Consensus dependencies - using local copies
consensus-core = { path = "meta-consensus/core" }
consensus-config = { path = "meta-consensus/config" }
consensus-types = { path = "meta-consensus/types" }

# Async runtime
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { version = "0.7", features = ["codec"] }

# Serialization
serde = { workspace = true }
serde_json = { version = "1.0.95", features = ["preserve_order"] }
bcs = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.15", default-features = false, features = ["std", "env-filter", "fmt", "json"] }

# Network
mysten-network = { path = "../../crates/mysten-network" }
mysten-metrics = { path = "../../crates/mysten-metrics" }
mysten-common = { path = "../../crates/mysten-common" }

# Storage
typed-store = { path = "../../crates/typed-store" }

# Protocol
meta-protocol-config = { path = "../../crates/meta-protocol-config" }

# Crypto - use git source
fastcrypto = { workspace = true }
shared-crypto = { path = "../../crates/shared-crypto" }

# Utilities
parking_lot = { workspace = true }
itertools = { workspace = true }
prometheus = { workspace = true }
rand = { workspace = true }
toml = { version = "0.7.4", features = ["preserve_order"] }
base64 = { workspace = true }
hex = "0.4.3"
hostname = "0.3.1"
async-trait = { workspace = true }
prost = { workspace = true }
sha3 = "0.10.6"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
socket2 = "0.5"  # For TCP socket keepalive support


# CLI
clap = { version = "4.4", features = ["derive", "wrap_help"] }
metanode-keytool = { path = "../../crates/metanode-keytool" }
once_cell = "1.21.3"
futures = "0.3.31"
rayon = "1.11.0"
telemetry-subscribers = { version = "0.2.0", path = "../../crates/telemetry-subscribers" }

[build-dependencies]
prost-build = "0.14.1"

[dev-dependencies]
tempfile = { workspace = true }

# Patch dependencies to fix axum-server compilation issue
# [patch.crates-io]
# # Try to use a compatible version of hyper-util
# # This is a workaround for axum-server compilation issue

[[bin]]
name = "metanode"
path = "src/main.rs"

