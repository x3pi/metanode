name: Go CI (execution)

# Minimal build/vet/test gate for the `execution` Go module, including the
# CGO-linked MVM C++ linker it depends on. This is the baseline that was
# previously missing entirely: go build/vet/test were all red on `dev` before
# a handful of stale files (duplicate `func main`, a renamed test API, a few
# stale test assumptions) were cleaned up. Keep this green — a red run here
# means a real build/vet/test regression, not pre-existing debt.
#
# Scope: the Rust crates (mtn-nomt-ffi, metanode) are built because the Go module links them, but their own unit
# tests (consensus/metanode/meta-consensus) are NOT run here yet.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress (dev/main pushes always run to completion) (a full run takes 12-22 min).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-build-test:
    runs-on: ubuntu-latest
    # Observed full runs: ~12 min warm, ~22 min with a cold Rust cache. Fail a hung run instead of waiting 6 h.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: execution
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: execution/go.mod
          cache-dependency-path: execution/go.sum

      - name: Setup Rust toolchain (NOMT FFI)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo (NOMT FFI)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          # Only dev/main runs write the cache; PR runs restore from it, which avoids cache churn per branch.
          save-if: ${{ github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main' }}

      - name: Cache C++ MVM builds
        uses: actions/cache@v5
        with:
          path: |
            execution/pkg/mvm/c_mvm/build
            execution/pkg/mvm/linker/build
          key: ${{ runner.os }}-mvm-cpp-${{ hashFiles('execution/pkg/mvm/**/*.cpp', 'execution/pkg/mvm/**/*.h', 'execution/pkg/mvm/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-mvm-cpp-

      - name: Install native build dependencies (MVM C++ linker)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libtbb-dev libxapian-dev \
            libmpfr-dev libgmp-dev uuid-dev libleveldb-dev libsecp256k1-dev protobuf-compiler

      - name: Build Rust libraries (libmtn_nomt.a and libmetanode.a)
        working-directory: .
        run: |
          cargo build --release --locked -p mtn-nomt-ffi -p metanode
          mkdir -p consensus/metanode/target/release
          cp target/release/libmetanode.a consensus/metanode/target/release/

      - name: Build MVM C++ linker
        working-directory: execution/pkg/mvm
        run: bash build.sh

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Check CPU cores
        run: |
          CORES=$(nproc)
          echo "Detected CPU cores: $CORES"
          if [ "$CORES" -lt 2 ]; then
            echo "❌ [ERROR] CI yêu cầu tối thiểu 2 nhân CPU (hiện tại phát hiện: $CORES nhân)."
            echo "Không thể chạy kiểm thử cụm phân tán / consensus trên máy 1 nhân CPU do gây nghẽn luồng và timeout giả!"
            exit 1
          fi

      - name: go test
        run: go test -p 2 -count=1 ./...
