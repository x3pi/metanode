syntax = "proto3";
package transaction;
option go_package = "github.com/meta-node-blockchain/meta-node/execution/pkg/proto";
option java_package = "com.meta_node.protos.compiled.transaction";

enum ACTION {
  EMPTY = 0;
  STAKE = 1;
  UNSTAKE = 2;
  DEPLOY_SMART_CONTRACT = 3;
  CALL_SMART_CONTRACT = 4;
  REWARD = 5;
  PUNISH = 6;
  MINE = 7; 
  OPEN_CHANNEL = 8;
  JOIN_CHANNEL = 9;
  COMMIT_ACCOUNT_STATE_CHANNEL = 10;
  COMMIT_CHANNEL = 11;
  UPDATE_STORAGE_HOST = 12;
}

enum FEE_TYPE {
  USER_CHARGE_FEE = 0;
  SMART_CONTRACT_CHARGE_FEE = 1;
}  

message Transaction {
  bytes ToAddress = 1;
  bytes Amount = 3;
  uint64 MaxGas = 4;
  uint64 MaxGasPrice = 5;
  uint64 MaxTimeUse = 6;
  bytes Data = 7;
  bytes LastDeviceKey = 9;
  bytes NewDeviceKey = 10;
  bytes Sign = 11;
  bytes Nonce = 12;
  bytes FromAddress = 13;
  bool ReadOnly = 14;

  // Bổ sung cho giao dịch eth
  uint64 ChainID = 15;
  uint64 Type = 16;
  bytes R = 17;
  bytes S = 18;
  bytes V = 19;

  // Thêm cho EIP-1559/EIP-2930
  bytes GasTipCap = 20;
  bytes GasFeeCap = 21;
  repeated AccessTuple AccessList = 22;

  // Thêm cho EIP-4844 (Blob, type 0x03) và EIP-7702 (SetCode, type 0x04).
  // Tag 8 KHÔNG dùng được ở đây: các bản sao proto khác (consensus/, cmd/rpc/)
  // đã dùng tag 8 cho RelatedAddresses dù bản canonical này bỏ trống nó.
  repeated bytes BlobVersionedHashes = 23;
  bytes MaxFeePerBlobGas = 24;
  // Sidecar KHÔNG tham gia vào TransactionHashData/chữ ký — tx chỉ cam kết vào
  // BlobVersionedHashes ở trên; sidecar là "network representation" được verify
  // lại bằng KZG lúc nhận, và có thể bị prune theo retention window mà không
  // làm đổi tx hash.
  BlobSidecar Sidecar = 25;
  repeated SetCodeAuthorization AuthorizationList = 26;
}

message AccessTuple {
  bytes Address = 1;
  repeated bytes StorageKeys = 2;
}

// BlobSidecar mang dữ liệu blob thô + bằng chứng KZG cho một Blob tx (EIP-4844).
// Cố ý tách khỏi phần tham gia hash: xem ghi chú tại Transaction.Sidecar.
message BlobSidecar {
  repeated bytes Blobs = 1;
  repeated bytes Commitments = 2;
  repeated bytes Proofs = 3;
}

// SetCodeAuthorization là một mục trong authorization_list của SetCode tx (EIP-7702).
message SetCodeAuthorization {
  uint64 ChainID = 1;
  bytes Address = 2;
  uint64 Nonce = 3;
  bytes YParity = 4;
  bytes R = 5;
  bytes S = 6;
}

message TransactionHashData {
  bytes FromAddress = 1;
  bytes ToAddress = 2;
  bytes Amount = 3;
  uint64 MaxGas = 4;
  uint64 MaxGasPrice = 5;
  uint64 MaxTimeUse = 6;
  bytes Data = 7;
  uint64 Type = 8;
  bytes LastDeviceKey = 9;
  bytes NewDeviceKey = 10;
  bytes Nonce = 11;
  uint64 ChainID = 12;
  bytes R = 13;
  bytes S = 14;
  bytes V = 15;
  bytes GasTipCap = 16;
  bytes GasFeeCap = 17;
  repeated AccessTuple AccessList = 18;

  // Thêm cho EIP-4844/EIP-7702 — phải tham gia hash vì đây là dữ liệu tx cam kết
  // (không phải sidecar). Cùng thứ tự tag như trong Transaction ở trên nhưng
  // đánh số riêng theo dãy tag còn trống của message này (19-21).
  repeated bytes BlobVersionedHashes = 19;
  bytes MaxFeePerBlobGas = 20;
  repeated SetCodeAuthorization AuthorizationList = 21;
}




message DeployData {
  bytes Code = 1;
  // string StorageHost = 2; // DEPRECATED
  bytes StorageAddress = 3;
}

message CallData {
  bytes Input = 1;
}

message OpenStateChannelData {
  repeated bytes ValidatorAddresses = 1;
}

message UpdateStorageHostData {
  string StorageHost = 1;
  bytes StorageAddress = 2;
}

message MassTransferData {
  map<string,bytes> MapAddressAmount = 1;
}

message Transactions {
  repeated Transaction Transactions = 1;
}

message VerifyTransactionSignRequest {
  bytes Hash = 1; 
  bytes Pubkey = 2; 
  bytes Sign = 3;
}

message VerifyTransactionSignResult {
  bytes Hash = 1; 
  bool Valid = 2; 
}

message TransactionError {
  int64 Code = 1;
  string Description = 2;
}

message TransactionHashWithErrorCode {
  bytes TransactionHash = 1;
  int64 Code = 2;
}

message TransactionWithDeviceKey {
  Transaction Transaction = 1;
  bytes DeviceKey = 2;
}

message TransactionsWithBlockNumber {
  repeated Transaction Transactions = 1;
  uint64 BlockNumber = 2; 
}

message ExecuteSCTransactions {
  repeated Transaction Transactions = 1;
  uint64 GroupId = 2; 
  uint64 BlockNumber = 3; 
}

message FromNodeTransactionsResult {
  repeated bytes ValidTransactionHashes = 1;
  repeated TransactionHashWithErrorCode TransactionErrors = 2;
  uint64 BlockNumber = 3;
}

message ToNodeTransactionsResult {
  repeated bytes ValidTransactionHashes = 1;
  uint64 BlockNumber = 3;
}

message TransactionsFromLeader {
  repeated Transaction Transactions = 1;
  bytes AggSign = 2;
  uint64 BlockNumber = 3;
  uint64 TimeStamp = 4;
}


message TransactionHashWithError {
  bytes Hash = 1;  // Hash của giao dịch gây lỗi
  int64 Code = 2;             // Mã lỗi
  string Description = 3;     // Mô tả lỗi
  bytes Output = 4; // chuỗi byte do evm return
}

// GetTransactionByHashRequest - Request để lấy transaction theo hash
message GetTransactionByHashRequest {
  bytes TransactionHash = 1;      // Hash của transaction cần lấy
}

// TransactionEntry - Transaction entry trong response
message TransactionEntry {
  bytes TransactionHash = 1;
  bytes FromAddress = 2;
  bytes ToAddress = 3;
  bytes Amount = 4;
  uint64 Nonce = 5;
  uint64 MaxGas = 6;
  uint64 MaxGasPrice = 7;
  bytes Data = 8;
  uint64 Type = 9;
  uint64 ChainID = 10;
  bytes V = 11;
  bytes R = 12;
  bytes S = 13;
  bytes BlockHash = 14;
  uint64 BlockNumber = 15;
  uint64 TransactionIndex = 16;
  bytes GasTipCap = 17;
  bytes GasFeeCap = 18;
}

// GetTransactionByHashResponse - Response chứa transaction data
message GetTransactionByHashResponse {
  TransactionEntry Transaction = 1; // Transaction entry (null nếu không tìm thấy)
  string Error = 2;               // Error message nếu có lỗi
}
