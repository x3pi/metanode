global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # MetaNode Go Execution Engine Metrics
  - job_name: "metanode-go-execution"
    static_configs:
      - targets: 
        - "192.168.1.233:8757" # Node 0
        - "192.168.1.232:8757" # Node 1
        - "192.168.1.231:8757" # Node 2
        - "192.168.1.230:8757" # Node 3

  # MetaNode Rust Consensus Metrics
  - job_name: "metanode-rust-consensus"
    static_configs:
      - targets:
        - "192.168.1.233:9100" # Node 0
        - "192.168.1.232:9100" # Node 1
        - "192.168.1.231:9100" # Node 2
        - "192.168.1.230:9100" # Node 3

  # Hardware Node Exporter Metrics
  - job_name: "node_exporter"
    static_configs:
      - targets:
        - "192.168.1.233:9105" # Node 0
        - "192.168.1.232:9105" # Node 1
        - "192.168.1.231:9105" # Node 2
        - "192.168.1.230:9105" # Node 3
