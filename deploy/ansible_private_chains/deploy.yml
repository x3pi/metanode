---
- name: Local build and config generation for Private Chains
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_action: "{{ deploy_action | default('setup') }}"
    active_target: "{{ target_chain | default('all') }}"
  tasks:
    - name: Ensure binaries (simple_chain, metanode) exist
      when: "ansible_action in ['setup', 'reset']"
      block:
        - name: Check simple_chain binary
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/../../execution/cmd/simple_chain/simple_chain"
          register: sc_bin_stat

        - name: Build simple_chain binary
          ansible.builtin.command:
            cmd: "go build -o simple_chain ."
            chdir: "{{ playbook_dir }}/../../execution/cmd/simple_chain"

    - name: Generate configurations for targeted private chains
      when: "ansible_action in ['setup', 'reset']"
      block:
        - name: Run gen_single_chain.py for each targeted private chain
          ansible.builtin.shell:
            cmd: |
              set -e
              export CHAIN_ID="{{ hostvars[item]['chain_id'] }}"
              export RPC_PORT="{{ hostvars[item]['rpc_port'] }}"
              export PORT_OFFSET="{{ hostvars[item]['port_offset'] }}"
              export IP="{{ hostvars[item]['ansible_host'] }}"
              export VALIDATORS="{{ hostvars[item]['validators'] | default(1) }}"
              export ROOT_RPC="{{ root_anchor_rpc }}"
              export LOCAL_OUT="{{ playbook_dir }}/data/chain_{{ hostvars[item]['chain_id'] }}"
              export TARGET_DIR="{{ hostvars[item]['install_dir'] | default('/opt/metanode/chain-' ~ hostvars[item]['chain_id']) }}"
              
              SUBMITTER_KEY="{{ root_anchor_submitter_key | default('') }}"
              if [ -z "$SUBMITTER_KEY" ]; then
                echo "❌ ERROR: root_anchor_submitter_key chưa được cấu hình trong inventory.yml"
                exit 1
              fi
  
              # SECURITY (C8 fix, PR #84 review, 2026-08-28): ReserveChainID must be the SAME
              # single chain across every participant, and it must NOT be each private chain's own
              # ID -- if a private chain configures itself as its own Reserve, it trivially passes
              # its own LocalChainID==ReserveChainID check and is free to do ceiling-enforced
              # attestCommit for ANY source chain's value against its own local ledger copy,
              # exactly the multi-destination overdraw C8 was meant to prevent (see
              # note/cross_chain_attack_scenario_catalog.md item C8). Root Anchor is the intended
              # Reserve (gen_root_anchor_chain.py already self-configures reserve_chain_id to its
              # own chain ID) -- fetch Root Anchor's REAL on-chain chain ID via eth_chainId rather
              # than trusting a hand-typed inventory value that could drift from reality.
              RESERVE_CHAIN_ID_HEX=$(curl -s -X POST "$ROOT_RPC" -H "Content-Type: application/json" \
                -d '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('result',''))")
              if [ -z "$RESERVE_CHAIN_ID_HEX" ]; then
                echo "❌ ERROR: could not fetch Root Anchor's chain ID via eth_chainId from $ROOT_RPC"
                exit 1
              fi
              RESERVE_CHAIN_ID=$((RESERVE_CHAIN_ID_HEX))
              echo "ℹ️  Reserve chain ID resolved from Root Anchor ($ROOT_RPC) = $RESERVE_CHAIN_ID"
  
              if [ "{{ ansible_action }}" = "reset" ]; then
                rm -rf "$LOCAL_OUT"
              fi
  
              if [ ! -f "$LOCAL_OUT/node-0/config.json" ]; then
                python3 "{{ playbook_dir }}/../systemd/gen_single_chain.py" \
                  --chain-id "$CHAIN_ID" \
                  --ip "$IP" \
                  --rpc-port "$RPC_PORT" \
                  --port-offset "$PORT_OFFSET" \
                  --validators "$VALIDATORS" \
                  --root-anchor-rpc "$ROOT_RPC" \
                  --root-anchor-submitter-key "$SUBMITTER_KEY" \
                  --reserve-chain-id "$RESERVE_CHAIN_ID" \
                  --output-dir "$LOCAL_OUT"
              fi
              
              # Chuẩn hóa đường dẫn trong config.json và node.toml cho từng validator node (/opt/metanode/chain-XXX/node-N)
              python3 << 'EOF'
              import json
              import os
              import re
              
              local_out = os.environ.get('LOCAL_OUT', '')
              t_dir = os.environ.get('TARGET_DIR', '')
              num_validators = int(os.environ.get('VALIDATORS', '1'))
              
              for node_id in range(num_validators):
                  n_dir = f'{t_dir}/node-{node_id}'
                  cfg_path = f'{local_out}/node-{node_id}/config.json'
                  if os.path.exists(cfg_path):
                      with open(cfg_path) as f:
                          c = json.load(f)
                      
                      c['log_path'] = f'{n_dir}/logs/execution'
                      c['backup_path'] = f'{n_dir}/data/execution/backup'
                      c['genesis_file_path'] = f'{t_dir}/config/genesis.json'
                      c['rust_config_path'] = f'{n_dir}/config/node.toml'
                      if 'Databases' in c:
                          c['Databases']['RootPath'] = f'{n_dir}/data/execution/db'
                          c['Databases']['SnapshotPath'] = f'{n_dir}/data/execution/snapshots'
                      with open(cfg_path, 'w') as f:
                          json.dump(c, f, indent=2)

                  toml_path = f'{local_out}/node-{node_id}/node.toml'
                  if os.path.exists(toml_path):
                      with open(toml_path) as f:
                          content = f.read()
                      
                      content = re.sub(r'protocol_key_path\s*=\s*".*?"', f'protocol_key_path = "{n_dir}/keys/protocol_key.json"', content)
                      content = re.sub(r'network_key_path\s*=\s*".*?"', f'network_key_path = "{n_dir}/keys/network_key.json"', content)
                      content = re.sub(r'storage_path\s*=\s*".*?"', f'storage_path = "{n_dir}/data/consensus"', content)
                      
                      with open(toml_path, 'w') as f:
                          f.write(content)
              EOF
          loop: "{{ groups['private_chains'] }}"
          when: "active_target == 'all' or active_target | string == hostvars[item]['chain_id'] | string"

- name: Deploy and Manage Private Chains across Nodes (/opt/metanode)
  hosts: private_chains
  become: yes
  gather_facts: false
  vars:
    ansible_action: "{{ deploy_action | default('setup') }}"
    active_target: "{{ target_chain | default('all') }}"
    open_ports_enabled: "{{ open_ports | default(false) | bool }}"
    num_validators: "{{ validators | default(1) | int }}"
    node_list: "{{ range(0, (validators | default(1) | int)) | list }}"
  tasks:
    - name: Check if host is targeted
      ansible.builtin.set_fact:
        is_targeted: "{{ active_target == 'all' or active_target | string == chain_id | string }}"
        target_install_dir: "{{ install_dir | default('/opt/metanode/chain-' ~ chain_id) }}"

    - name: Create metanode system group
      when: is_targeted and ansible_action in ['setup', 'reset']
      ansible.builtin.group:
        name: metanode
        system: yes

    - name: Create metanode system user
      when: is_targeted and ansible_action in ['setup', 'reset']
      ansible.builtin.user:
        name: metanode
        group: metanode
        system: yes
        create_home: no
        shell: /usr/sbin/nologin

    - name: Stop systemd service(s)
      when: "is_targeted and ansible_action in ['stop', 'restart', 'reset', 'clean_data']"
      block:
        - name: Stop individual node services
          ansible.builtin.systemd:
            name: "metanode-private-{{ chain_id }}-node-{{ item }}.service"
            state: stopped
          loop: "{{ node_list }}"
          ignore_errors: true

        - name: Stop legacy service if exists
          ansible.builtin.systemd:
            name: "metanode-private-{{ chain_id }}.service"
            state: stopped
          ignore_errors: true

    - name: Clean data directories only (preserve keys & configs)
      when: "is_targeted and ansible_action == 'clean_data'"
      ansible.builtin.shell: |
        for nid in {{ node_list | join(' ') }}; do
          rm -rf "{{ target_install_dir }}/node-$nid/data"/*
          rm -rf "{{ target_install_dir }}/node-$nid/logs"/*
          mkdir -p "{{ target_install_dir }}/node-$nid/data/execution/db" \
                   "{{ target_install_dir }}/node-$nid/data/execution/backup" \
                   "{{ target_install_dir }}/node-$nid/data/execution/snapshots" \
                   "{{ target_install_dir }}/node-$nid/data/consensus" \
                   "{{ target_install_dir }}/node-$nid/logs/execution"
        done
        chown -R metanode:metanode "{{ target_install_dir }}"

    - name: Clean entire installation directory on reset
      when: "is_targeted and ansible_action == 'reset'"
      ansible.builtin.file:
        path: "{{ target_install_dir }}"
        state: absent

    - name: Deploy directories and files
      when: "is_targeted and ansible_action in ['setup', 'reset']"
      block:
        - name: Create base directory structure under /opt/metanode/chain-{{ chain_id }}
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: metanode
            group: metanode
            mode: '0755'
          loop:
            - "{{ target_install_dir }}"
            - "{{ target_install_dir }}/bin"
            - "{{ target_install_dir }}/config"

        - name: Create subdirectories for each validator node
          ansible.builtin.file:
            path: "{{ target_install_dir }}/node-{{ item.0 }}/{{ item.1 }}"
            state: directory
            owner: metanode
            group: metanode
            mode: '0755'
          with_nested:
            - "{{ node_list }}"
            - [ 'config', 'keys', 'logs/execution', 'data/execution/db', 'data/execution/backup', 'data/execution/snapshots', 'data/consensus' ]

        - name: Copy simple_chain binary
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../execution/cmd/simple_chain/simple_chain"
            dest: "{{ target_install_dir }}/bin/simple_chain"
            owner: metanode
            group: metanode
            mode: '0755'

        - name: Copy metanode consensus binary
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../target/release/metanode"
            dest: "{{ target_install_dir }}/bin/metanode"
            owner: metanode
            group: metanode
            mode: '0755'
          ignore_errors: true

        - name: Copy shared genesis file
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/data/chain_{{ chain_id }}/genesis.json"
            dest: "{{ target_install_dir }}/config/genesis.json"
            owner: metanode
            group: metanode
            mode: '0644'

        - name: Copy node configurations
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/data/chain_{{ chain_id }}/node-{{ item.0 }}/{{ item.1.src }}"
            dest: "{{ target_install_dir }}/node-{{ item.0 }}/{{ item.1.dest }}"
            owner: metanode
            group: metanode
            mode: '0644'
          with_nested:
            - "{{ node_list }}"
            - [ { src: 'config.json', dest: 'config/execution.json' }, { src: 'node.toml', dest: 'config/node.toml' } ]

        - name: Copy node keys
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/data/chain_{{ chain_id }}/node-{{ item.0 }}/keys/{{ item.1 }}"
            dest: "{{ target_install_dir }}/node-{{ item.0 }}/keys/{{ item.1 }}"
            owner: metanode
            group: metanode
            mode: '0600'
          with_nested:
            - "{{ node_list }}"
            - [ "protocol_key.json", "network_key.json", "authority_key.json", "eth_key.json" ]

        - name: Create systemd service files for each validator node
          ansible.builtin.template:
            src: "{{ playbook_dir }}/roles/private_node/templates/metanode-private.service.j2"
            dest: "/etc/systemd/system/metanode-private-{{ chain_id }}-node-{{ item }}.service"
            mode: '0644'
          loop: "{{ node_list }}"

        - name: Ensure correct recursive ownership
          ansible.builtin.file:
            path: "{{ target_install_dir }}"
            owner: metanode
            group: metanode
            recurse: yes

        - name: Reload systemd daemon
          ansible.builtin.systemd:
            daemon_reload: yes

    - name: Open firewall ports via UFW if --open-ports is enabled
      when: "is_targeted and open_ports_enabled"
      ansible.builtin.shell: |
        which ufw > /dev/null 2>&1 || exit 0
        for nid in {{ node_list | join(' ') }}; do
          ufw allow $(( {{ rpc_port }} + nid ))/tcp comment "Metanode Chain {{ chain_id }} Node $nid RPC" || true
          ufw allow $(( 20200 + {{ port_offset | int }} + nid ))/tcp comment "Metanode Chain {{ chain_id }} Node $nid Peer RPC" || true
          ufw allow $(( 10200 + {{ port_offset | int }} + nid ))/tcp comment "Metanode Chain {{ chain_id }} Node $nid Consensus" || true
          ufw allow $(( 12100 + {{ port_offset | int }} + nid ))/tcp comment "Metanode Chain {{ chain_id }} Node $nid Metrics" || true
          ufw allow $(( 13000 + {{ port_offset | int }} + nid ))/tcp comment "Metanode Chain {{ chain_id }} Node $nid DNS" || true
        done
      ignore_errors: true

    - name: Start / Restart systemd service(s)
      when: "is_targeted and ansible_action in ['setup', 'reset', 'start', 'restart', 'clean_data']"
      ansible.builtin.systemd:
        name: "metanode-private-{{ chain_id }}-node-{{ item }}.service"
        state: restarted
        enabled: yes
      loop: "{{ node_list }}"

- name: Post-Deployment Verification
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_action: "{{ deploy_action | default('setup') }}"
    active_target: "{{ target_chain | default('all') }}"
  tasks:
    - name: Check health of targeted private chains
      when: "ansible_action in ['setup', 'reset', 'start', 'restart', 'clean_data', 'status']"
      block:
        - name: Filter targeted hosts for status check
          ansible.builtin.set_fact:
            check_hosts: >-
              {%- set h = [] -%}
              {%- for item in groups['private_chains'] -%}
                {%- if active_target == 'all' or active_target | string == hostvars[item]['chain_id'] | string -%}
                  {%- set _ = h.append(item) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ h }}

        - name: Wait for RPC to respond on targeted chains (waiting for nodes to warm up)
          ansible.builtin.uri:
            url: "http://{{ hostvars[item]['ansible_host'] }}:{{ hostvars[item]['rpc_port'] }}"
            method: POST
            headers:
              Content-Type: "application/json"
            body_format: json
            body:
              jsonrpc: "2.0"
              method: "eth_blockNumber"
              params: []
              id: 1
            return_content: yes
          loop: "{{ check_hosts }}"
          register: rpc_health_results
          retries: 20
          delay: 3
          until: rpc_health_results is not failed

        - name: Display status of targeted Private Chains
          ansible.builtin.debug:
            msg: "✅ Private Chain {{ hostvars[item.item]['chain_id'] }} (http://{{ hostvars[item.item]['ansible_host'] }}:{{ hostvars[item.item]['rpc_port'] }}): Block Number {{ item.json.result }}"
          loop: "{{ rpc_health_results.results }}"
          loop_control:
            label: "Chain {{ hostvars[item.item]['chain_id'] }}"
