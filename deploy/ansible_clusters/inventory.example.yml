all:
  vars:
    ansible_user: "metanode"
    # Installation and base directories (standardized across all machines)
    install_dir: "/opt/metanode"
    ansible_become_pass: "YOUR_BECOME_PASSWORD"
    # Raft shared configuration for execution clusters
    raft_secret_file: "/opt/metanode/raft_secret.key"
    # Parent Chain configuration
    parent_chain_rpc_port: 8547
    parent_chain_host: "127.0.0.1"
    # Unified EVM Chain ID for Parent Chain and all Execution Clusters
    chain_id: 991

  children:
    # ── Parent Chain Node (100% Rust BFT Consensus Engine, Chain ID: 991) ──
    parent_chain_nodes:
      hosts:
        parent_node:
          ansible_host: 127.0.0.1
          ansible_connection: local
          parent_http_port: 8547
          node_data_dir: "/opt/metanode/parent_chain"

    # ── Execution Clusters (Rollup Shards with Raft HA Consensus) ────────
    exec_clusters:
      children:
        # Cluster 1: 3-Replica High Availability Raft Cluster
        cluster_1:
          vars:
            cluster_id: 1
            cluster_name: "exec1"
          hosts:
            exec1_replica1:
              ansible_host: 127.0.0.1
              ansible_connection: local
              consensus_mode: "raft"
              node_id: "exec1_r1"
              rpc_port: 8646
              p2p_port: 4200
              raft_port: 7110
              forward_port: 7210
              raft_bootstrap: true
              node_data_dir: "/opt/metanode/exec1_r1"
              private_key: "YOUR_CLUSTER1_PRIVATE_KEY_HEX"
              address: "0xYourCluster1SequencerAddress"
              bls_priv: "YOUR_CLUSTER1_BLS_PRIVATE_KEY_HEX"
              bls_pub: "0xYourCluster1BlsPublicKeyHex"
              raft_peers:
                - id: "exec1_r1"
                  address: "127.0.0.1:7110"
                  forward_address: "127.0.0.1:7210"
                - id: "exec1_r2"
                  address: "127.0.0.1:7111"
                  forward_address: "127.0.0.1:7211"
                - id: "exec1_r3"
                  address: "127.0.0.1:7112"
                  forward_address: "127.0.0.1:7212"

            exec1_replica2:
              ansible_host: 127.0.0.1
              ansible_connection: local
              consensus_mode: "raft"
              node_id: "exec1_r2"
              rpc_port: 8648
              p2p_port: 4201
              raft_port: 7111
              forward_port: 7211
              raft_bootstrap: false
              node_data_dir: "/opt/metanode/exec1_r2"
              private_key: "YOUR_CLUSTER1_PRIVATE_KEY_HEX"
              address: "0xYourCluster1SequencerAddress"
              bls_priv: "YOUR_CLUSTER1_BLS_PRIVATE_KEY_HEX"
              bls_pub: "0xYourCluster1BlsPublicKeyHex"
              raft_peers:
                - id: "exec1_r1"
                  address: "127.0.0.1:7110"
                  forward_address: "127.0.0.1:7210"
                - id: "exec1_r2"
                  address: "127.0.0.1:7111"
                  forward_address: "127.0.0.1:7211"
                - id: "exec1_r3"
                  address: "127.0.0.1:7112"
                  forward_address: "127.0.0.1:7212"

            exec1_replica3:
              ansible_host: 127.0.0.1
              ansible_connection: local
              consensus_mode: "raft"
              node_id: "exec1_r3"
              rpc_port: 8649
              p2p_port: 4203
              raft_port: 7112
              forward_port: 7212
              raft_bootstrap: false
              node_data_dir: "/opt/metanode/exec1_r3"
              private_key: "YOUR_CLUSTER1_PRIVATE_KEY_HEX"
              address: "0xYourCluster1SequencerAddress"
              bls_priv: "YOUR_CLUSTER1_BLS_PRIVATE_KEY_HEX"
              bls_pub: "0xYourCluster1BlsPublicKeyHex"
              raft_peers:
                - id: "exec1_r1"
                  address: "127.0.0.1:7110"
                  forward_address: "127.0.0.1:7210"
                - id: "exec1_r2"
                  address: "127.0.0.1:7111"
                  forward_address: "127.0.0.1:7211"
                - id: "exec1_r3"
                  address: "127.0.0.1:7112"
                  forward_address: "127.0.0.1:7212"

        # Cluster 2: Single-Replica Raft Node
        cluster_2:
          vars:
            cluster_id: 2
            cluster_name: "exec2"
          hosts:
            exec2_replica1:
              ansible_host: 127.0.0.1
              ansible_connection: local
              consensus_mode: "raft"
              node_id: "exec2_r1"
              rpc_port: 8647
              p2p_port: 4202
              raft_port: 7120
              forward_port: 7220
              raft_bootstrap: true
              node_data_dir: "/opt/metanode/exec2"
              private_key: "YOUR_CLUSTER2_PRIVATE_KEY_HEX"
              address: "0xYourCluster2SequencerAddress"
              bls_priv: "YOUR_CLUSTER2_BLS_PRIVATE_KEY_HEX"
              bls_pub: "0xYourCluster2BlsPublicKeyHex"
              raft_peers:
                - id: "exec2_r1"
                  address: "127.0.0.1:7120"
                  forward_address: "127.0.0.1:7220"
