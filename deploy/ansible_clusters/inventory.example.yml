all:
  vars:
    ansible_user: "metanode"
    # Installation and base directories (standardized across all machines)
    install_dir: "/opt/metanode"
    ansible_become_pass: "YOUR_BECOME_PASSWORD"
    # Raft shared configuration for execution clusters
    raft_secret_file: "/opt/metanode/raft_secret.key"
    # Parent Chain configuration
    parent_chain_rpc_port: 8547
    parent_chain_host: "127.0.0.1"
    # EVM Chain ID for Execution Clusters
    chain_id: 991
    # Dedicated Chain ID for Parent Chain (Đ7: 990)
    parent_chain_id: 990
    # BLS public key for mtn_api.go's devnet sender 0xb4eb...; must match its signing key.
    devnet_sender_bls_pubkey: "0xb518c65d0f5f23858fd28f0473cb1fbaccc8aaa960880aee841585861f245abc0c4e4dce5b3693cfe60da4902d9484bc"
    # Who may register as a cluster (a cluster's certificate authorizes deposits, i.e. mints float).
    #   devnet:     true  -> any key may register.
    #   production: false + list the BLS public keys (hex, 48 bytes) of the allowed clusters.
    parent_open_cluster_registration: true
    parent_allowed_clusters: []
    # Float model (production): the supply is exactly what the genesis allocates; depositToFloat (the only mint path)
    # is disabled. BLS keys are accounts that transfer float to each other. 1 unit = 10^18 base units.
    #   parent_allow_deposit_to_float: false          # devnet/tests only: true
    #   parent_min_float_to_register: "1000000000000000000000"   # 1000 units: any key holding this may register as a cluster
    #   parent_float_accounts:
    #     - { bls_public_key: "<48-byte hex>", balance: "1500000000000000000000" }
    parent_allow_deposit_to_float: true   # devnet only
    # Conservation guard (production: 'enforce', devnet: 'warn' or 'off'):
    # Asserts that Parent Chain float(cluster BLS) == sum(alloc) on the execution cluster.
    # When 'enforce', blocks outbound cross-chain transfers if float != sum(alloc).
    bls_conservation_mode: "warn"             # devnet: warn, production: enforce
    bls_conservation_interval_seconds: 300
    # ── Security tokens (2026-09-30 audit fixes) — put REAL values in ansible-vault, never in plaintext ──
    # snapshot_server_token: "{{ vault_snapshot_server_token }}"   # protects snapshot downloads; POST /create needs it
    # snapshot_server_bind: "127.0.0.1"                            # restrict the snapshot port if peers need no access
    # quic_pinned_cert_sha256: "<leaf-cert-sha256>,<...>"         # pin QUIC peer certs (otherwise unauthenticated)


  children:
    # ── Parent Chain Committee (100% Rust BFT Consensus Engine, Chain ID: 990) ──
    parent_chain_nodes:
      hosts:
        # Example 4-Node BFT Parent Chain Committee (single-node or multi-node supported)
        parent_node_0:
          ansible_host: 127.0.0.1
          ansible_connection: local
          parent_node_id: 0
          parent_http_port: 18601
          parent_network_address: "127.0.0.1:19001"
          peer_rpc_port: 19501
          peer_rpc_addresses: ["127.0.0.1:19502", "127.0.0.1:19503", "127.0.0.1:19504"]
          metrics_port: 19601
          node_data_dir: "/opt/metanode/parent_chain_0"
        parent_node_1:
          ansible_host: 127.0.0.1
          ansible_connection: local
          parent_node_id: 1
          parent_http_port: 18602
          parent_network_address: "127.0.0.1:19002"
          peer_rpc_port: 19502
          peer_rpc_addresses: ["127.0.0.1:19501", "127.0.0.1:19503", "127.0.0.1:19504"]
          metrics_port: 19602
          node_data_dir: "/opt/metanode/parent_chain_1"
        parent_node_2:
          ansible_host: 127.0.0.1
          ansible_connection: local
          parent_node_id: 2
          parent_http_port: 18603
          parent_network_address: "127.0.0.1:19003"
          peer_rpc_port: 19503
          peer_rpc_addresses: ["127.0.0.1:19501", "127.0.0.1:19502", "127.0.0.1:19504"]
          metrics_port: 19603
          node_data_dir: "/opt/metanode/parent_chain_2"
        parent_node_3:
          ansible_host: 127.0.0.1
          ansible_connection: local
          parent_node_id: 3
          parent_http_port: 18604
          parent_network_address: "127.0.0.1:19004"
          peer_rpc_port: 19504
          peer_rpc_addresses: ["127.0.0.1:19501", "127.0.0.1:19502", "127.0.0.1:19503"]
          metrics_port: 19604
          node_data_dir: "/opt/metanode/parent_chain_3"

    # ── Execution Clusters (Rollup Shards with Raft HA Consensus) ────────
    exec_clusters:
      hosts:
        # Cluster 1: 3-Replica High Availability Raft Cluster
        exec1_replica1:
          ansible_host: 127.0.0.1
          ansible_connection: local
          cluster_id: 1
          cluster_name: "exec1"
          consensus_mode: "raft"
          node_id: "exec1_r1"
          rpc_port: 8646
          p2p_port: 4200
          raft_port: 7110
          forward_port: 7210
          raft_bootstrap: true
          node_data_dir: "/opt/metanode/exec1_r1"
          private_key: "YOUR_CLUSTER1_PRIVATE_KEY_HEX"
          address: "0xYourCluster1SequencerAddress"
          bls_priv: "YOUR_CLUSTER1_BLS_PRIVATE_KEY_HEX"
          bls_pubkey: "0xYourCluster1BlsPublicKeyHex"
          raft_peers:
            - id: "exec1_r1"
              address: "127.0.0.1:7110"
              forward_address: "127.0.0.1:7210"
            - id: "exec1_r2"
              address: "127.0.0.1:7111"
              forward_address: "127.0.0.1:7211"
            - id: "exec1_r3"
              address: "127.0.0.1:7112"
              forward_address: "127.0.0.1:7212"

        exec1_replica2:
          ansible_host: 127.0.0.1
          ansible_connection: local
          cluster_id: 1
          cluster_name: "exec1"
          consensus_mode: "raft"
          node_id: "exec1_r2"
          rpc_port: 8648
          p2p_port: 4201
          raft_port: 7111
          forward_port: 7211
          raft_bootstrap: false
          node_data_dir: "/opt/metanode/exec1_r2"
          private_key: "YOUR_CLUSTER1_PRIVATE_KEY_HEX"
          address: "0xYourCluster1SequencerAddress"
          bls_priv: "YOUR_CLUSTER1_BLS_PRIVATE_KEY_HEX"
          bls_pubkey: "0xYourCluster1BlsPublicKeyHex"
          raft_peers:
            - id: "exec1_r1"
              address: "127.0.0.1:7110"
              forward_address: "127.0.0.1:7210"
            - id: "exec1_r2"
              address: "127.0.0.1:7111"
              forward_address: "127.0.0.1:7211"
            - id: "exec1_r3"
              address: "127.0.0.1:7112"
              forward_address: "127.0.0.1:7212"

        exec1_replica3:
          ansible_host: 127.0.0.1
          ansible_connection: local
          cluster_id: 1
          cluster_name: "exec1"
          consensus_mode: "raft"
          node_id: "exec1_r3"
          rpc_port: 8649
          p2p_port: 4203
          raft_port: 7112
          forward_port: 7212
          raft_bootstrap: false
          node_data_dir: "/opt/metanode/exec1_r3"
          private_key: "YOUR_CLUSTER1_PRIVATE_KEY_HEX"
          address: "0xYourCluster1SequencerAddress"
          bls_priv: "YOUR_CLUSTER1_BLS_PRIVATE_KEY_HEX"
          bls_pubkey: "0xYourCluster1BlsPublicKeyHex"
          raft_peers:
            - id: "exec1_r1"
              address: "127.0.0.1:7110"
              forward_address: "127.0.0.1:7210"
            - id: "exec1_r2"
              address: "127.0.0.1:7111"
              forward_address: "127.0.0.1:7211"
            - id: "exec1_r3"
              address: "127.0.0.1:7112"
              forward_address: "127.0.0.1:7212"

        # Cluster 2: Single-Replica Raft Node
        exec2_replica1:
          ansible_host: 127.0.0.1
          ansible_connection: local
          cluster_id: 2
          cluster_name: "exec2"
          consensus_mode: "raft"
          node_id: "exec2_r1"
          rpc_port: 8647
          p2p_port: 4202
          raft_port: 7120
          forward_port: 7220
          raft_bootstrap: true
          node_data_dir: "/opt/metanode/exec2"
          private_key: "YOUR_CLUSTER2_PRIVATE_KEY_HEX"
          address: "0xYourCluster2SequencerAddress"
          bls_priv: "YOUR_CLUSTER2_BLS_PRIVATE_KEY_HEX"
          bls_pubkey: "0xYourCluster2BlsPublicKeyHex"
          raft_peers:
            - id: "exec2_r1"
              address: "127.0.0.1:7120"
              forward_address: "127.0.0.1:7220"
