all:
  vars:
    ansible_user: "metanode"
    # Unified EVM Chain ID for transaction signing across all execution clusters
    evm_chain_id: 991
    # Installation and base directories
    install_dir: "/opt/metanode"
    deploy_dir: "/home/abc/chain-n/metanode"
    # Raft shared configuration for execution clusters
    raft_secret_file: "/opt/metanode/raft_secret.key"
    # Parent Chain configuration
    parent_chain_rpc_port: 8547
    parent_chain_host: "127.0.0.1"

  children:
    # ── Parent Chain Node (100% Rust BFT Consensus Engine) ──────────────
    parent_chain_nodes:
      hosts:
        parent_node:
          ansible_host: 127.0.0.1
          ansible_connection: local
          parent_http_port: 8547
          node_data_dir: "/opt/metanode/parent_chain"
          rust_config_path: "consensus/metanode/config/node_devnet_parent.toml"

    # ── Execution Clusters (Rollup Shards with Raft HA Consensus) ────────
    exec_clusters:
      hosts:
        # Cluster 1: 3-Replica High Availability Raft Cluster
        exec1_replica1:
          ansible_host: 127.0.0.1
          ansible_connection: local
          cluster_id: 1
          cluster_name: "exec1"
          consensus_mode: "raft"
          node_id: "exec1_r1"
          rpc_port: 8646
          p2p_port: 4200
          raft_port: 7110
          forward_port: 7210
          raft_bootstrap: true
          node_data_dir: "/opt/metanode/exec1_r1"
          private_key: "0f326c0b9bb86353ac317dd8f9b045fd1877473674ba24500139fed777b26a0c"
          address: "0x1F0ECA432E1B18b140814beF0ce1Ba2b09DE44c5"
          bls_priv: "0f326c0b9bb86353ac317dd8f9b045fd1877473674ba24500139fed777b26a0c"
          bls_pubkey: "0x944488b425d29336c7913a3b45946adee6b9bfbd0838c6c8f422f4b4277066f26b3da0530c9f9865e6e534a05ae6c128"
          raft_peers:
            - id: "exec1_r1"
              address: "127.0.0.1:7110"
              forward_address: "127.0.0.1:7210"
            - id: "exec1_r2"
              address: "127.0.0.1:7111"
              forward_address: "127.0.0.1:7211"
            - id: "exec1_r3"
              address: "127.0.0.1:7112"
              forward_address: "127.0.0.1:7212"

        exec1_replica2:
          ansible_host: 127.0.0.1
          ansible_connection: local
          cluster_id: 1
          cluster_name: "exec1"
          consensus_mode: "raft"
          node_id: "exec1_r2"
          rpc_port: 8648
