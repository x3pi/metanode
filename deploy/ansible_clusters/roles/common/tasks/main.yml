---
- name: Ensure target directory tree exists on host
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ install_dir }}"
    - "{{ bin_dir }}"
    - "{{ base_data_dir }}"
    - "{{ base_log_dir }}"

- name: Ensure existing cluster daemons are stopped before binary update
  when: deploy_action is defined and deploy_action in ['reset', 'stop', 'deploy']
  ansible.builtin.shell: |
    pkill -9 -f "{{ bin_dir }}/simple_chain" || true
    pkill -9 -f "{{ bin_dir }}/parent_chain" || true
  failed_when: false

- name: Distribute built binaries and base assets to node
  when: deploy_action in ['setup', 'deploy', 'restart']
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: '0755'
  loop:
    - { src: "{{ local_bin_dir }}/parent_chain", dest: "{{ bin_dir }}/parent_chain" }
    - { src: "{{ local_bin_dir }}/simple_chain", dest: "{{ bin_dir }}/simple_chain" }
    - { src: "{{ playbook_dir }}/../../deploy/systemd/genesis.json.example", dest: "{{ install_dir }}/genesis_base.json" }

# private_dev_keys.json holds devnet-only keys: never ship it outside devnet, and
# only when the operator actually provides it (it is not tracked in the repo).
- name: Check for optional devnet keys file
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/private_dev_keys.json"
  delegate_to: localhost
  become: false
  register: private_dev_keys_stat

- name: Distribute devnet keys (devnet only)
  when:
    - (metanode_env | default('production')) == 'devnet' or (node_env | default('production')) == 'devnet'
    - private_dev_keys_stat.stat.exists
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/private_dev_keys.json"
    dest: "{{ install_dir }}/private_dev_keys.json"
    mode: '0600'
