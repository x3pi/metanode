---
- name: Build and verify binaries locally
  delegate_to: localhost
  run_once: true
  when: not (skip_build | default(false) | bool)
  block:
    - name: Ensure target local bin directory exists
      ansible.builtin.file:
        path: "{{ local_bin_dir }}"
        state: directory
        mode: '0755'

    - name: Check if parent_chain binary already exists
      ansible.builtin.stat:
        path: "{{ local_bin_dir }}/parent_chain"
      register: parent_bin_stat

    - name: Check if simple_chain binary already exists
      ansible.builtin.stat:
        path: "{{ local_bin_dir }}/simple_chain"
      register: simple_bin_stat

    - name: Build Rust consensus and nomt FFI libraries
      when: not (skip_build | default(false)) or not parent_bin_stat.stat.exists or not simple_bin_stat.stat.exists
      ansible.builtin.shell: |
        cargo build --release -p mtn-nomt-ffi
        cargo build --release -p metanode
        mkdir -p consensus/metanode/target/release
        cp -p target/release/libmetanode.a consensus/metanode/target/release/libmetanode.a
      args:
        chdir: "{{ playbook_dir }}/../../"
      environment:
        PATH: "{{ lookup('env', 'HOME') }}/.cargo/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"

    - name: Build MVM C++ and linker libraries
      when: not (skip_build | default(false)) or not parent_bin_stat.stat.exists or not simple_bin_stat.stat.exists
      ansible.builtin.shell: |
        bash build.sh
      args:
        chdir: "{{ playbook_dir }}/../../execution/pkg/mvm"

    - name: Build parent_chain binary
      when: not (skip_build | default(false)) or not parent_bin_stat.stat.exists
      ansible.builtin.command:
        cmd: "go build -o {{ local_bin_dir }}/parent_chain ."
        chdir: "{{ playbook_dir }}/../../execution/cmd/parent_chain"
      environment:
        PATH: "/usr/local/go/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"

    - name: Build simple_chain binary
      when: not (skip_build | default(false)) or not simple_bin_stat.stat.exists
      ansible.builtin.command:
        cmd: "go build -o {{ local_bin_dir }}/simple_chain ."
        chdir: "{{ playbook_dir }}/../../execution/cmd/simple_chain"
      environment:
        PATH: "/usr/local/go/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"

    - name: Build bls_pubkey tool (controller-side validator key pre-flight; not distributed to nodes)
      ansible.builtin.command:
        cmd: "go build -o {{ local_bin_dir }}/bls_pubkey ."
        chdir: "{{ playbook_dir }}/../../execution/cmd/tool/bls_pubkey"
      environment:
        PATH: "/usr/local/go/bin:{{ ansible_env.PATH | default('/usr/local/bin:/usr/bin:/bin') }}"

    - name: Set executable permissions on built binaries
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0755'
      loop:
        - "{{ local_bin_dir }}/parent_chain"
        - "{{ local_bin_dir }}/simple_chain"
        - "{{ local_bin_dir }}/bls_pubkey"

    - name: Compute checksum of parent_chain binary
      ansible.builtin.stat:
        path: "{{ local_bin_dir }}/parent_chain"
        checksum_algorithm: sha256
      register: parent_sha_stat

    - name: Compute checksum of simple_chain binary
      ansible.builtin.stat:
        path: "{{ local_bin_dir }}/simple_chain"
        checksum_algorithm: sha256
      register: simple_sha_stat

    - name: Set expected binary checksums for cluster deployment
      ansible.builtin.set_fact:
        expected_sha_parent: "{{ parent_sha_stat.stat.checksum }}"
        expected_sha_exec: "{{ simple_sha_stat.stat.checksum }}"
      delegate_to: localhost
      delegate_facts: true

    - name: Record git version and dirty working tree status
      ansible.builtin.shell: |
        commit=$(git rev-parse HEAD 2>/dev/null || echo "unknown")
        status=$(git status --porcelain 2>/dev/null || echo "")
        echo "Git Commit: $commit"
        if [ -n "$status" ]; then
          echo "⚠️ Git working tree is dirty:"
          echo "$status"
        else
          echo "Git working tree is clean."
        fi
      register: git_info
      args:
        chdir: "{{ playbook_dir }}/../../"
      changed_when: false

    - name: Display build verification summary
      ansible.builtin.debug:
        msg:
          - "Parent Chain SHA256: {{ parent_sha_stat.stat.checksum }}"
          - "Simple Chain SHA256: {{ simple_sha_stat.stat.checksum }}"
          - "{{ git_info.stdout_lines | default([]) }}"
