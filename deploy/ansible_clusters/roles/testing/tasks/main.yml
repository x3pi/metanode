---
- name: Execute automated integration tests
  delegate_to: localhost
  run_once: true
  block:
    - name: Run E2E multi-cluster real world scenarios test
      ansible.builtin.shell: |
        export PARENT_CHAIN_URL="http://{{ hostvars[groups['parent_chain_nodes'][0]]['ansible_host'] | default('127.0.0.1') }}:{{ hostvars[groups['parent_chain_nodes'][0]]['parent_http_port'] | default(8547) }}"
        export EXEC1_URL="http://{{ (groups['exec_clusters'] | map('extract', hostvars) | selectattr('cluster_id', 'equalto', 1) | list | first)['ansible_host'] | default('127.0.0.1') }}:{{ (groups['exec_clusters'] | map('extract', hostvars) | selectattr('cluster_id', 'equalto', 1) | list | first)['rpc_port'] | default(8646) }}"
        export EXEC2_URL="http://{{ (groups['exec_clusters'] | map('extract', hostvars) | selectattr('cluster_id', 'equalto', 2) | list | first)['ansible_host'] | default('127.0.0.1') }}:{{ (groups['exec_clusters'] | map('extract', hostvars) | selectattr('cluster_id', 'equalto', 2) | list | first)['rpc_port'] | default(8647) }}"
        go run {{ test_script_path }}
      register: test_output
      ignore_errors: true

    - name: Save test log to file
      ansible.builtin.copy:
        content: "{{ test_output.stdout }}\n{{ test_output.stderr }}"
        dest: "{{ playbook_dir }}/test_run.log"
        mode: '0644'

    - name: Check if all scenarios passed
      set_fact:
        tests_passed: "{{ test_output.rc == 0 and 'TẤT CẢ 9/9 KỊCH BẢN' in test_output.stdout }}"

    - name: Display test outcome
      ansible.builtin.debug:
        msg: >-
          {{ '✅ TẤT CẢ 9 KỊCH BẢN TEST THÀNH CÔNG!' if tests_passed else '❌ BÀI TEST TÍCH HỢP THẤT BẠI! Xem test_run.log để biết chi tiết.' }}
