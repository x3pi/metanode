---
- name: Execute automated integration tests
  delegate_to: localhost
  run_once: true
  block:
    - name: Require the Parent Chain RPC token
      ansible.builtin.assert:
        that:
          - parent_chain_rpc_token | default('') | length > 0
        fail_msg: "Configure parent_chain_rpc_token as an Ansible Vault value before running integration tests."

    - name: Read test endpoints from the exported configuration
      ansible.builtin.set_fact:
        test_endpoints: "{{ lookup('ansible.builtin.file', '/tmp/rpc_nodes.json') | from_json }}"

    - name: Require Parent Chain and both execution cluster endpoints
      ansible.builtin.assert:
        that:
          - test_endpoints.get('root_anchor', '') | length > 0
          - test_endpoints.get('private_chains', {}).get('chain_a', {}).get('rpc_url', '') | length > 0
          - test_endpoints.get('private_chains', {}).get('chain_b', {}).get('rpc_url', '') | length > 0
        fail_msg: "Export Parent Chain and cluster IDs 1 and 2 to /tmp/rpc_nodes.json before running integration tests."

    - name: Run E2E multi-cluster real world scenarios test
      ansible.builtin.shell: |
        go run scripts/test/test_real_world_scenarios.go
      args:
        chdir: "{{ playbook_dir }}/../../execution"
      become: true
      environment:
        PARENT_CHAIN_URL: "{{ test_endpoints.root_anchor }}"
        EXEC1_URL: "{{ test_endpoints.private_chains.chain_a.rpc_url }}"
        EXEC2_URL: "{{ test_endpoints.private_chains.chain_b.rpc_url }}"
        PARENT_CHAIN_RPC_TOKEN: "{{ parent_chain_rpc_token }}"
        PATH: "{{ lookup('ansible.builtin.env', 'PATH') }}"
      register: test_output
      ignore_errors: true
      no_log: true

    - name: Save test log to file
      ansible.builtin.copy:
        content: "{{ test_output.stdout }}\n{{ test_output.stderr }}"
        dest: "{{ playbook_dir }}/test_run.log"
        mode: '0644'

    - name: Check if all scenarios passed
      set_fact:
        tests_passed: "{{ test_output.rc == 0 and 'TẤT CẢ 9/9 KỊCH BẢN' in test_output.stdout }}"

    - name: Display test outcome
      ansible.builtin.debug:
        msg: >-
          {{ '✅ TẤT CẢ 9 KỊCH BẢN TEST THÀNH CÔNG!' if tests_passed else '❌ BÀI TEST TÍCH HỢP THẤT BẠI! Xem test_run.log để biết chi tiết.' }}

    - name: Fail when an integration scenario fails
      ansible.builtin.fail:
        msg: "Integration scenarios failed; see test_run.log for details."
      when: not (tests_passed | bool)
