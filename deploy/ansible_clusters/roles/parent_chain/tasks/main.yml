---
# Secure by default: a closed registry (the default) needs an explicit allow-list, otherwise nobody could ever
# register and the chain would be unusable. Devnet must opt in with parent_open_cluster_registration: true.
- name: Require an explicit cluster policy before deploying the Parent Chain genesis
  when: "deploy_action in ['deploy', 'reset']"
  ansible.builtin.assert:
    that:
      - (parent_open_cluster_registration | default(false) | bool) or ((parent_allowed_clusters | default([])) | length > 0) or ((parent_float_accounts | default([])) | length > 0)
    fail_msg: >-
      parent_open_cluster_registration is false (the default) but parent_allowed_clusters is empty. Set
      parent_allowed_clusters (founding clusters) or parent_float_accounts (genesis balances; any key reaching parent_min_float_to_register may register) for production, or
      parent_open_cluster_registration: true (devnet only).

# ── Stop Service ─────────────────────────────────────────────────────────────
- name: Stop Parent Chain service {{ inventory_hostname }}
  when: "deploy_action in ['stop', 'restart', 'reset', 'clean', 'deploy', 'setup']"
  block:
    - name: Stop Parent Chain via systemd
      ansible.builtin.systemd:
        name: "metanode-{{ inventory_hostname }}"
        state: stopped
      ignore_errors: true

    - name: Stop legacy metanode-parentchain via systemd if present
      ansible.builtin.systemd:
        name: metanode-parentchain
        state: stopped
      when: (parent_node_id | default(0) | int) == 0
      ignore_errors: true

    - name: Terminate lingering process for this exact parent node
      ansible.builtin.shell:
        cmd: |
          # 1. Kill via PID file if valid for this node data directory
          if [ -f "{{ node_data_dir }}/parent_chain.pid" ]; then
            pid=$(cat "{{ node_data_dir }}/parent_chain.pid" 2>/dev/null || true)
            if [ -n "$pid" ] && [ -d "/proc/$pid" ]; then
              if grep -q -F "{{ node_data_dir }}" "/proc/$pid/cmdline" 2>/dev/null; then
                kill -15 "$pid" 2>/dev/null || true
                sleep 0.5
                kill -9 "$pid" 2>/dev/null || true
              fi
            fi
            rm -f "{{ node_data_dir }}/parent_chain.pid"
          fi

          # 2. Kill only processes whose cmdline explicitly references this node data directory
          for pid in $(pgrep -f "{{ node_data_dir }}" 2>/dev/null || true); do
            if grep -q -F "parent_chain" "/proc/$pid/cmdline" 2>/dev/null && grep -q -F "{{ node_data_dir }}" "/proc/$pid/cmdline" 2>/dev/null; then
              kill -15 "$pid" 2>/dev/null || true
              sleep 0.5
              kill -9 "$pid" 2>/dev/null || true
            fi
          done

          # 3. Kill process holding this node specific HTTP port if it belongs to parent_chain
          target_port="{{ parent_http_port | default(8547) }}"
          for pid in $(ss -ltnpH "sport = :$target_port" 2>/dev/null | sed -n 's/.*pid=\([0-9]\+\).*/\1/p'); do
            if grep -q -F "parent_chain" "/proc/$pid/cmdline" 2>/dev/null; then
              kill -15 "$pid" 2>/dev/null || true
              sleep 0.5
              kill -9 "$pid" 2>/dev/null || true
            fi
          done
      failed_when: false

# ── Clean / Reset Data ───────────────────────────────────────────────────────
- name: Clean Parent Chain data directories
  when: "deploy_action in ['clean', 'reset']"
  block:
    - name: Remove database files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ node_data_dir }}/chain_data"
        - "{{ node_data_dir }}/storage"
        - "{{ node_data_dir }}/parentchain_db"
        - "{{ node_data_dir }}/consensus"
        - "{{ node_data_dir }}/consensus_storage"
        - "{{ node_data_dir }}/rocksdb_dummy_init"
        - "{{ node_data_dir }}/backup"
        - "{{ node_data_dir }}/logs"

# ── Firewall (UFW) Configuration ───────────────────────────────────────────
# OPT-IN only (`--open-ports` => deploy_action=open_ports). The HTTP RPC is client-facing; the peer RPC and the metrics
# endpoint are internal and are opened only to the other cluster members (plus `ufw_extra_sources`, e.g. a monitoring
# host that scrapes metrics).
- name: Firewall (UFW) Configuration for Parent Chain
  when: "deploy_action == 'open_ports' or (open_ports | default(false) | bool)"
  block:
    - name: Check if UFW is active on Parent Chain host
      ansible.builtin.command: ufw status
      register: ufw_status_parent
      changed_when: false
      failed_when: false
      become: true

    - name: Compute the cluster member IPs allowed on internal ports
      ansible.builtin.set_fact:
        ufw_peer_ips: >-
          {{ (((groups['exec_clusters'] | default([])) + (groups['parent_chain_nodes'] | default([])))
              | unique
              | map('extract', hostvars, 'ansible_host')
              | select('defined')
              | map('string')
              | reject('equalto', '127.0.0.1')
              | unique
              | list) + (ufw_extra_sources | default([])) }}

    - name: Automatically configure firewall (UFW) rules for Parent Chain
      when:
        - ufw_status_parent.rc == 0
        - "'Status: active' in ufw_status_parent.stdout"
      become: true
      block:
        - name: Allow the client-facing Parent Chain HTTP RPC port in UFW
          ansible.builtin.command: "ufw allow {{ parent_http_port | default(parent_chain_rpc_port | default(8547)) }}/tcp comment 'Metanode Parent Chain HTTP RPC {{ inventory_hostname }}'"
          register: ufw_parent_http
          changed_when: "'Rule added' in ufw_parent_http.stdout or 'Rule updated' in ufw_parent_http.stdout"

        - name: Allow internal Parent Chain ports (peer RPC, metrics, P2P) only from cluster members
          ansible.builtin.command: "ufw allow from {{ item.1 }} to any port {{ item.0 }} proto tcp comment 'Metanode Parent Chain internal {{ inventory_hostname }}'"
          loop: "{{ [peer_rpc_port | default(19501), metrics_port | default(19601), parent_p2p_port | default(19001)] | product(ufw_peer_ips) | list }}"
          register: ufw_parent_rules
          changed_when: "'Rule added' in ufw_parent_rules.stdout or 'Rule updated' in ufw_parent_rules.stdout"

        - name: Reload UFW to apply port rules
          ansible.builtin.command: ufw reload
          when: >-
            (ufw_parent_http is defined and ufw_parent_http.changed) or
            (ufw_parent_rules is defined and ufw_parent_rules.changed)

# ── Setup Configuration & Service Unit ───────────────────────────────────────
- name: Setup Parent Chain configuration
  when: "deploy_action in ['setup', 'deploy', 'restart', 'reset']"
  block:
    - name: Ensure Parent Chain data and log directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user | default('abc') }}"
        group: "{{ ansible_user | default('abc') }}"
        recurse: yes
      loop:
        - "{{ node_data_dir }}"
        - "{{ node_data_dir }}/logs"
        - "{{ base_log_dir }}"

    - name: Check if legacy log exists in base_log_dir as regular file
      ansible.builtin.stat:
        path: "{{ base_log_dir }}/parent_chain_{{ parent_node_id | default(0) }}.log"
      register: legacy_parent_log_stat

    - name: Archive legacy parent chain log if it is a regular file
      ansible.builtin.command:
        cmd: "mv {{ base_log_dir }}/parent_chain_{{ parent_node_id | default(0) }}.log {{ base_log_dir }}/parent_chain_{{ parent_node_id | default(0) }}.log.old"
      when: legacy_parent_log_stat.stat.exists and not legacy_parent_log_stat.stat.islnk
      failed_when: false

    - name: Create convenience symlink in base_log_dir pointing to node logs
      ansible.builtin.file:
        src: "{{ node_data_dir }}/logs/parent_chain.log"
        dest: "{{ base_log_dir }}/parent_chain_{{ parent_node_id | default(0) }}.log"
        state: link
        force: yes
      ignore_errors: true

    - name: Deploy Parent Chain config.json
      ansible.builtin.template:
        src: parentchain_config.json.j2
        dest: "{{ node_data_dir }}/config.json"
        mode: '0644'
        owner: "{{ ansible_user | default('abc') }}"
        group: "{{ ansible_user | default('abc') }}"

    - name: Deploy Parent Chain genesis file
      ansible.builtin.template:
        src: parent_genesis.json.j2
        dest: "{{ node_data_dir }}/parent_genesis.json"
        mode: '0644'
        owner: "{{ ansible_user | default('abc') }}"
        group: "{{ ansible_user | default('abc') }}"

    - name: Copy Parent Chain consensus keys
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../consensus/metanode/config/{{ item }}"
        dest: "{{ node_data_dir }}/{{ item }}"
        mode: '0600'
        owner: "{{ ansible_user | default('abc') }}"
        group: "{{ ansible_user | default('abc') }}"
      loop:
        - "node_{{ parent_node_id | default(0) }}_protocol_key.json"
        - "node_{{ parent_node_id | default(0) }}_network_key.json"

    - name: Deploy Parent Chain Rust consensus node_parent.toml
      ansible.builtin.template:
        src: node_parent.toml.j2
        dest: "{{ node_data_dir }}/node_parent.toml"
        mode: '0644'
        owner: "{{ ansible_user | default('abc') }}"
        group: "{{ ansible_user | default('abc') }}"

    - name: Write security environment file (tokens / pins from vault vars, 0600)
      ansible.builtin.template:
        src: security.env.j2
        dest: "{{ node_data_dir }}/security.env"
        mode: '0600'
        owner: "{{ ansible_user | default('abc') }}"
        group: "{{ ansible_user | default('abc') }}"
      no_log: true

    - name: Deploy systemd service unit
      ansible.builtin.template:
        src: metanode-parentchain.service.j2
        dest: "/etc/systemd/system/metanode-{{ inventory_hostname }}.service"
        mode: '0644'
      notify: Reload systemd

# ── Start / Restart Service ──────────────────────────────────────────────────
- name: Start Parent Chain
  when: "deploy_action in ['setup', 'deploy', 'start', 'restart', 'reset']"
  block:
    - name: Start service via systemd
      ansible.builtin.systemd:
        name: "metanode-{{ inventory_hostname }}"
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Wait for Parent Chain HTTP RPC port to respond
      ansible.builtin.wait_for:
        port: "{{ parent_http_port | default(8547) }}"
        host: "{{ ansible_host | default('127.0.0.1') }}"
        delay: 2
        timeout: 25

    - name: Verify Parent Chain HTTP RPC endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ parent_http_port | default(8547) }}/inbound?cluster_id=1"
        method: GET
        status_code: [200, 404]
      register: rpc_check
      retries: 5
      delay: 2
      until: rpc_check.status in [200, 404]
