# ==============================================================================
# METANODE CLUSTER INVENTORY TEMPLATE (inventory.example.yml)
# Copy file này thành inventory.yml và cấu hình thông tin cụm node của bạn.
# ==============================================================================
# 🔒 HƯỚNG DẪN BẢO MẬT (HARDENING BEST PRACTICES):
# 1. KHUYÊN DÙNG CHO PRODUCTION: Xác thực qua SSH Key (`ansible_ssh_private_key_file`).
#    Thiết lập ssh-copy-id để không phải lưu mật khẩu SSH vào file cấu hình.
# 2. VỚI MẬT KHẨU ROOT/SUDO:
#    - Cách A (Khuyên dùng): Cấp quyền `NOPASSWD: ALL` cho deployment user trên các node.
#    - Cách B: Mã hóa bằng Ansible Vault:
#        ansible-vault encrypt_string 'mat_khau_that' --name 'ansible_become_pass'
#      rồi dán chuỗi !vault vào inventory.yml.
# ==============================================================================

# CÁCH 1: KHUYÊN DÙNG CHO PRODUCTION (SSH Key-based auth, không lưu mật khẩu plaintext)
all:
  children:
    metanode_cluster:
      vars:
        ansible_user: "abc"
        # 🔑 Đường dẫn SSH private key trên máy deployer (hỗ trợ RSA hoặc Ed25519)
        ansible_ssh_private_key_file: "~/.ssh/id_ed25519"

        # Nếu user đã có quyền NOPASSWD trong /etc/sudoers thì không cần ansible_become_pass.
        # Nếu bắt buộc cần mật khẩu sudo, dùng Ansible Vault để mã hóa:
        # ansible_become_pass: !vault |
        #          $ANSIBLE_VAULT;1.1;AES256
        #          38323863383437633230623762643534...

        telegram_bot_token: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
        telegram_chat_id: "YOUR_TELEGRAM_CHAT_ID_HERE"
        epoch_duration_seconds: 600
        snapshot_frequency_blocks: 500
        snapshot_max_snapshots: 2
        snapshot_max_part_size_mb: 600
        epochs_to_keep: 5
      hosts:
        192.168.1.230_validator:
          node_ids: [4]
          is_synconly: true
          ansible_host: 192.168.1.230
        
        192.168.1.231_validator:
          node_ids: [3]
          ansible_host: 192.168.1.231

# ------------------------------------------------------------------------------
# CÁCH 2: TÙY CHỌN DÀNH RIÊNG CHO DEVNET / LAB NỘI BỘ (Mật khẩu plaintext)
# ⚠️ CẢNH BÁO: KHÔNG khuyến nghị sử dụng mật khẩu plaintext cho Production/Staging!
# ------------------------------------------------------------------------------
#       hosts:
#         192.168.1.230_validator:
#           node_ids: [4]
#           ansible_host: 192.168.1.230
#           ansible_ssh_pass: "MẬT_KHẨU_SSH"
#           ansible_become_pass: "MẬT_KHẨU_SUDO"
#
# ------------------------------------------------------------------------------
# CÁCH 3: TÙY CHỌN CHẠY LOCAL TRÊN CÙNG 1 MÁY TÍNH
# ------------------------------------------------------------------------------
#       hosts:
#         192.168.1.234_validator:
#           node_ids: [0,1,2,3]
#           ansible_connection: local # <- Chạy trực tiếp trên máy đang gõ lệnh deploy
#           ansible_host: 127.0.0.1