all:
  vars:
    # URL RPC của Root Anchor (Public Chain 991) để các Private Chains kết nối đến Gateway
    root_anchor_rpc: "http://<ROOT_ANCHOR_IP>:10746"
    root_anchor_submitter_key: "<YOUR_SUBMITTER_PRIVATE_KEY_HEX>"
    root_anchor_genesis_supply: "400000000000000000000000000"
    root_anchor_per_chain_allocation: "100000000000000000000000000"
    ansible_user: "your_username"
    ansible_ssh_pass: "your_ssh_password"
    ansible_become_pass: "your_sudo_password"

  children:
    # =========================================================================
    # 1. PUBLIC CHAIN CLUSTER (ROOT ANCHOR - CHAIN 991)
    # =========================================================================
    metanode_cluster:
      vars:
        telegram_bot_token: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
        telegram_chat_id: "YOUR_TELEGRAM_CHAT_ID_HERE"
      hosts:
        # Server 1: Chạy Node 0 và Node 1
        server_validator_1:
          node_ids: [0, 1]
          rpc_nodes: [0, 1]
          ansible_connection: ssh # Dùng local nếu chạy ngay trên máy chủ này, hoặc ssh nếu qua mạng
          ansible_host: 192.168.1.10
          ansible_user: "your_username"
          ansible_ssh_pass: "your_ssh_password"
          ansible_become_pass: "your_sudo_password"
        
        # Server 2: Chạy Node 2
        server_validator_2:
          node_ids: [2]
          rpc_nodes: [2]
          ansible_connection: ssh
          ansible_host: 192.168.1.11
          ansible_user: "your_username"
          ansible_ssh_pass: "your_ssh_password"
          ansible_become_pass: "your_sudo_password"

    # =========================================================================
    # 2. PRIVATE CHAINS (CROSS-CHAIN ECOSYSTEM)
    # =========================================================================
    private_chains:
      hosts:
        # Private Chain 101 - 1 Node (Mặc định)
        private_chain_101:
          ansible_host: 192.168.1.20
          ansible_connection: ssh
          chain_id: 101
          validators: 1
          rpc_port: 8546
          port_offset: 10
          install_dir: "/opt/metanode/chain-101"

        # Private Chain 102 - 1 Node (Mặc định)
        private_chain_102:
          ansible_host: 192.168.1.21
          ansible_connection: ssh
          chain_id: 102
          validators: 1
          rpc_port: 8550
          port_offset: 20
          install_dir: "/opt/metanode/chain-102"

        # Private Chain 103 - 1 Node (Mặc định)
        private_chain_103:
          ansible_host: 192.168.1.22
          ansible_connection: ssh
          chain_id: 103
          validators: 1
          rpc_port: 8554
          port_offset: 30
          install_dir: "/opt/metanode/chain-103"

        # Private Chain 104 - 1 Node (Mặc định)
        private_chain_104:
          ansible_host: 192.168.1.23
          ansible_connection: ssh
          chain_id: 104
          validators: 1
          rpc_port: 8558
          port_offset: 40
          install_dir: "/opt/metanode/chain-104"