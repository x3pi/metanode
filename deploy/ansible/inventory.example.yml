# ==============================================================================
# METANODE CLUSTER INVENTORY TEMPLATE (inventory.example.yml)
# Copy file này thành inventory.yml và điều chỉnh các giá trị phù hợp với cụm node:
#   cp inventory.example.yml inventory.yml
# ==============================================================================

all:
  children:
    metanode_cluster:
      vars:
        # ----------------------------------------------------------------------
        # 1. CẤU HÌNH THÔNG BÁO TELEGRAM (Tùy chọn)
        # ----------------------------------------------------------------------
        # Điền Token Bot và Chat ID nhóm để nhận thông báo tự động khi deploy/crash
        telegram_bot_token: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
        telegram_chat_id: "YOUR_TELEGRAM_CHAT_ID_HERE"

        # [TÙY CHỌN] Khóa riêng (hex) của 1 tài khoản CÓ SỐ DƯ, dùng để monitors/start_monitors.sh
        # gửi 1 giao dịch thăm dò trước khi báo "chain stall" -- phân biệt chain đang rảnh (không
        # có giao dịch nên không tạo block mới) với chain bị treo thật. Không đặt thì dùng khóa
        # devnet công khai có sẵn trong repo (chỉ an toàn cho devnet/lab nội bộ).
        # probe_tx_key: "0xYOUR_FUNDED_DEV_ACCOUNT_PRIVATE_KEY_HERE"

        # ----------------------------------------------------------------------
        # 2. CẤU HÌNH CONSENSUS & SNAPSHOT TOÀN CỤM
        # ----------------------------------------------------------------------
        # Thời gian 1 epoch (giây). Sau mỗi epoch consensus chuyển vòng validator
        epoch_duration_seconds: 600

        # Tần suất đóng gói snapshot (ví dụ: cứ mỗi 500 block tạo 1 bản snapshot)
        snapshot_frequency_blocks: 500

        # Số lượng bản snapshot tối đa lưu trữ trên đĩa (tránh đầy dung lượng)
        snapshot_max_snapshots: 2

        # Kích thước tối đa của mỗi file nén snapshot (MB)
        snapshot_max_part_size_mb: 600

        # Dung lượng phân vùng hoặc file ảnh BTRFS cho snapshot (mặc định: 400G; hỗ trợ đơn vị G và T, ví dụ: 100G, 500G, 1T, 2T)
        btrfs_size: "400G"

        # Số epoch cũ giữ lại trước khi dọn dẹp state (đặt 0 nếu muốn chạy Archive Node,
        # giữ toàn bộ lịch sử — lưu ý sẽ khiến dung lượng đĩa tăng không giới hạn theo thời gian)
        epochs_to_keep: 5



      hosts:
        # ======================================================================
        # MÁY CHỦ 1 (Ví dụ: Máy Master / RPC Node)
        # ======================================================================
        server_1:
          ansible_host: 192.168.1.234
          ansible_user: "abc"
          # [BẮT BUỘC] Danh sách Node ID chạy trên máy này (ví dụ: chạy Node 0 và Node 3)
          node_ids: [0, 3]

          # [TÙY CHỌN] Các node mở cổng RPC (HTTP 10746, 10747...) cho client/dapp kết nối
          rpc_nodes: [0, 3]

          # [TÙY CHỌN] Các node áp dụng xóa bớt state cũ (prune) theo epochs_to_keep
          # prune_nodes: [0, 3]

          # Nếu máy triển khai chạy node đó luôn thì để local triển khai nhanh hơn
          # ansible_connection: local

          # --- PHƯƠNG THỨC XÁC THỰC SSH (Chọn 1 trong 2 cách dưới đây) ---
          # Cách A (Khuyên dùng cho Production): Xác thực bằng SSH Key (không cần mật khẩu)
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519"

          # Cách B (Dùng cho Lab / Devnet nội bộ): Xác thực bằng mật khẩu trực tiếp.
          # inventory.yml đã tự động bị gitignore nên mật khẩu ở đây không lộ ra
          # remote git — NHƯNG nó vẫn nằm dạng plaintext trên đĩa máy deploy. Nếu
          # máy đó có nhiều người dùng chung hoặc bạn muốn thêm 1 lớp bảo vệ nữa,
          # mã hoá riêng 2 dòng này bằng ansible-vault thay vì để plaintext (GitHub
          # issue #104): ansible_deploy.sh đã hỗ trợ sẵn, không cần sửa gì thêm —
          #   1) tạo mật khẩu vault:   openssl rand -base64 24 > .vault_pass
          #      (giữ .vault_pass ngoài git — đã có trong .gitignore)
          #   2) mã hoá 1 giá trị:     ansible-vault encrypt_string \
          #        --vault-password-file .vault_pass 'mat_khau_sudo' \
          #        --name ansible_become_pass
          #   3) dán khối `ansible_become_pass: !vault |` nó in ra vào ĐÚNG chỗ
          #      2 dòng dưới đây (thay vì gõ mật khẩu trực tiếp), lặp lại cho
          #      ansible_ssh_pass nếu cần.
          #   ansible_deploy.sh tự phát hiện `.vault_pass` (hoặc biến môi trường
          #   ANSIBLE_VAULT_PASSWORD_FILE) và tự thêm --vault-password-file —
          #   không cần đổi cách chạy `./ansible_deploy.sh --start` như cũ.
          # ansible_ssh_pass: "mat_khau_ssh"
          # ansible_become_pass: "mat_khau_sudo"

        # ======================================================================
        # MÁY CHỦ 2
        # ======================================================================
        server_2:
          ansible_host: 192.168.1.234
          ansible_user: "abc"
          node_ids: [1, 2]
          rpc_nodes: [1, 2]
          # prune_nodes: [1, 2]
          # Cách A: Dùng SSH Key
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519"

          # Cách B: Dùng Mật khẩu
          # ansible_ssh_pass: "mat_khau_ssh"
          # ansible_become_pass: "mat_khau_sudo"
