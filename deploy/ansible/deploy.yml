---
- name: Local build and configuration generation
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Build cluster_nodes list from inventory
      set_fact:
        cluster_nodes: >-
          {%- set nodes = [] -%}
          {%- for host in groups['metanode_cluster'] -%}
            {%- for nid in hostvars[host]['node_ids'] -%}
              {%- set is_sync = (nid | int in hostvars[host]['synconly_nodes'] | default([])) or (hostvars[host]['is_synconly'] | default(false)) -%}
              {%- set is_rpc = (nid | int in hostvars[host]['rpc_nodes'] | default([])) or (hostvars[host]['is_rpc'] | default(false)) -%}
              {%- set is_snapshot = (nid | int in hostvars[host]['snapshot_nodes'] | default([])) or (hostvars[host]['snapshot_enabled'] | default(false)) -%}
              {%- set host_prune_nodes = hostvars[host]['prune_nodes'] | default([]) -%}
              {%- set host_epochs_map = hostvars[host]['prune_epochs_map'] | default({}) -%}
              {%- set host_default_keep = hostvars[host]['epochs_to_keep'] | default(epochs_to_keep | default(0)) -%}
              {%- if (nid | string in host_epochs_map) -%}
                {%- set node_keep = host_epochs_map[nid | string] | int -%}
              {%- elif (nid | int in host_epochs_map) -%}
                {%- set node_keep = host_epochs_map[nid | int] | int -%}
              {%- elif 'prune_nodes' in hostvars[host] -%}
                {%- if (nid | int in host_prune_nodes) -%}
                  {%- set node_keep = hostvars[host]['prune_epochs_to_keep'] | default(5) | int -%}
                {%- else -%}
                  {%- set node_keep = 0 -%}
                {%- endif -%}
              {%- elif is_rpc or is_sync -%}
                {%- set node_keep = 0 -%}
              {%- else -%}
                {%- set node_keep = host_default_keep | int -%}
              {%- endif -%}
              {%- set _ = nodes.append({'node_id': nid, 'ip': hostvars[host]['ansible_host'] | default(host), 'is_synconly': is_sync, 'is_rpc': is_rpc, 'snapshot_enabled': is_snapshot, 'epochs_to_keep': node_keep}) -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ nodes }}
          
    - name: Build peers_map string
      set_fact:
        peers_map: >-
          {%- set parts = [] -%}
          {%- for node in cluster_nodes | sort(attribute='node_id') -%}
            {%- set _ = parts.append(node.node_id | string ~ '=' ~ node.ip) -%}
          {%- endfor -%}
          {{ parts | join(',') }}

    - name: Set cluster vars from metanode_cluster
      set_fact:
        snapshot_frequency_blocks: "{{ hostvars[groups['metanode_cluster'][0]]['snapshot_frequency_blocks'] | default(50) }}"
        epoch_duration_seconds: "{{ hostvars[groups['metanode_cluster'][0]]['epoch_duration_seconds'] | default(60) }}"
        snapshot_max_snapshots: "{{ hostvars[groups['metanode_cluster'][0]]['snapshot_max_snapshots'] | default(2) }}"
  tags: ["local_build", "gen_keys"]
  roles:
    - { role: local_build, when: "ansible_action in ['start', 'setup', 'gen_keys']", tags: ["local_build", "gen_keys"] }

- name: Deploy and Setup Metanode Cluster
  hosts: metanode_cluster
  become: yes
  any_errors_fatal: true
  gather_facts: true
  tags: ["cluster_deploy", "open_ports"]
  pre_tasks:
    - name: Ensure monitoring tools (sshpass, jq) are installed
      ansible.builtin.apt:
        name:
          - sshpass
          - jq
        state: present
        update_cache: false
      ignore_errors: true

    - name: Filter active nodes by target
      set_fact:
        target_active_nodes: >-
          {%- set nodes = [] -%}
          {%- for nid in node_ids -%}
            {%- if target_node == 'all' or target_node | string == nid | string -%}
              {%- set _ = nodes.append(nid) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ nodes }}

    - name: Check if node key directory exists locally
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ deploy_dir }}/node-{{ item }}_keys"
      loop: "{{ target_active_nodes }}"
      register: local_node_keys_stat
      become: no

    - name: Check if node key directory exists remotely
      ansible.builtin.stat:
        path: "{{ remote_deploy_dir }}/node-{{ item }}_keys"
      loop: "{{ target_active_nodes }}"
      register: remote_node_keys_stat

    - name: Refine active nodes based on deployment availability
      set_fact:
        active_nodes: >-
          {%- set nodes = [] -%}
          {%- for idx in range(target_active_nodes | length) -%}
            {%- set nid = target_active_nodes[idx] -%}
            {%- set l_stat = local_node_keys_stat.results[idx].stat | default({}) -%}
            {%- set r_stat = remote_node_keys_stat.results[idx].stat | default({}) -%}
            {%- if (l_stat.exists | default(false)) or (r_stat.exists | default(false)) -%}
              {%- set _ = nodes.append(nid) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ nodes }}

    - name: Get filesystem type for metanode install directory
      ansible.builtin.shell: "mkdir -p {{ metanode_install_dir }} && df -T {{ metanode_install_dir }} | awk 'NR==2 {print $2}'"
      register: fs_type
    - name: Check snapshot_enabled for each node
      delegate_to: localhost
      ansible.builtin.shell: "grep -q '\"snapshot_enabled\": true' {{ deploy_dir }}/node-{{ item }}_keys/execution.json && echo 'true' || echo 'false'"
      loop: "{{ active_nodes }}"
      register: snapshot_check
      become: no
      when: active_nodes | length > 0 and ansible_action in ['start', 'setup']
      ignore_errors: true
  roles:
    - { role: stop_services, when: "active_nodes | length > 0 and ansible_action in ['start', 'setup', 'stop']" }
    - { role: clean_data, when: "active_nodes | length > 0 and ansible_action in ['start', 'setup'] and keep_data | bool == false" }
    - { role: node_setup, when: "active_nodes | length > 0 and ansible_action in ['start', 'setup']" }
    - { role: snapshot_restore, when: "active_nodes | length > 0 and ansible_action in ['start', 'setup'] and restore_node != 'none'" }
    - { role: node_exporter, when: "active_nodes | length > 0 and ansible_action in ['start', 'setup']" }
    - { role: systemd_services, when: "active_nodes | length > 0 and ansible_action in ['start', 'setup']" }
    - { role: restart_services, when: "active_nodes | length > 0 and ansible_action == 'restart'" }
  tasks:
    - name: Check generated firewall scripts for nodes
      ansible.builtin.stat:
        path: "{{ remote_deploy_dir }}/node-{{ item }}_keys/open_ports.sh"
      loop: "{{ active_nodes }}"
      register: generated_firewall_scripts
      when: "ansible_action == 'open_ports' or (open_ports | default('false') | bool == true)"
      tags: ["open_ports"]

    - name: Fail when a generated firewall script is missing
      ansible.builtin.fail:
        msg: >-
          Missing generated firewall configuration for node {{ item.item }} at
          {{ remote_deploy_dir }}/node-{{ item.item }}_keys/open_ports.sh. Run setup to
          generate and deploy the node configuration
          before opening ports.
      loop: "{{ generated_firewall_scripts.results | default([]) }}"
      when:
        - "ansible_action == 'open_ports' or (open_ports | default('false') | bool == true)"
        - not item.stat.exists
      tags: ["open_ports"]

    - name: Open firewall ports from generated node configuration
      ansible.builtin.command:
        argv:
          - bash
          - "{{ remote_deploy_dir }}/node-{{ item }}_keys/open_ports.sh"
      loop: "{{ active_nodes }}"
      when: "ansible_action == 'open_ports' or (open_ports | default('false') | bool == true)"
      notify: Reload UFW
      tags: ["open_ports"]
  handlers:
    - name: Reload UFW
      ansible.builtin.command: ufw reload

- name: Post-deployment actions
  hosts: localhost
  connection: local
  gather_facts: false
  tags: ["post_deploy"]
  roles:
    # Runs before the Prometheus config generation below so Alertmanager is already listening on
    # :9093 by the time Prometheus (re)starts with the alerting: block that points at it.
    #
    # ignore_errors (2026-09-11): this role needs `become: true` (root) on localhost, which on a
    # dev/test machine without passwordless sudo configured fails immediately with "sudo: a
    # password is required" -- a known, pre-existing, unrelated environment quirk (see
    # [[reference_metanode_distributed_cluster]] memory). Before this fix, that single failure
    # made ansible-playbook return non-zero for the ENTIRE run, which ansible_deploy.sh then
    # reported as "❌ Quá trình Ansible ... thất bại với mã lỗi 2!" even when every actual node
    # (execution/consensus services) had already deployed successfully -- a misleading, scary
    # false alarm that looked identical to a real node-deploy failure. Alertmanager is
    # monitoring/alerting infrastructure, not part of node operation itself, so its failure
    # should never block or misreport the status of the actual deploy. A real environment where
    # this becomes needed should configure passwordless sudo for this play instead of relying on
    # this being silently skipped.
    - { role: alertmanager, become: true, when: "ansible_action not in ['stop', 'open_ports']", ignore_errors: true }
  tasks:
    - name: Generate /tmp/rpc_nodes.json for testing tools
      ansible.builtin.shell: |
        rm -f /tmp/rpc_nodes.json
        (umask 077 && python3 "{{ playbook_dir }}/parse_inventory.py" "{{ playbook_dir }}/inventory.yml" json > /tmp/rpc_nodes.json)
        chmod 0600 /tmp/rpc_nodes.json
      args:
        executable: /bin/bash
      when: "ansible_action not in ['stop', 'open_ports']"

    - name: Sync /tmp/rpc_nodes.json to block_hash_checker config-m-nodes.json
      ansible.builtin.copy:
        src: /tmp/rpc_nodes.json
        dest: "{{ playbook_dir }}/monitors/block_hash_checker/config-m-nodes.json"
        mode: '0600'
      when: "ansible_action not in ['stop', 'open_ports']"

    - name: Ensure Prometheus directory exists
      ansible.builtin.file:
        path: "{{ project_root }}/execution/deploy/prometheus"
        state: directory
        mode: '0755'
      when: "ansible_action not in ['stop', 'open_ports']"

    - name: Generate prometheus.yml dynamically for monitoring
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/monitoring_config/templates/prometheus.yml.j2"
        dest: "{{ project_root }}/execution/deploy/prometheus/prometheus.yml"
      when: "ansible_action not in ['stop', 'open_ports']"

    - name: Copy alert_rules.yml alongside the generated prometheus.yml (docker-compose path)
      # execution/docker-compose.monitoring.yml mounts execution/deploy/prometheus/ straight into
      # the Prometheus container as /etc/prometheus, so this one copy covers that deployment mode
      # for free. The bare-metal systemd path (this box's actual live setup) is handled
      # separately below, since its config lives at /etc/prometheus/ on the host, not here.
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/monitoring_config/templates/alert_rules.yml.j2"
        dest: "{{ project_root }}/execution/deploy/prometheus/alert_rules.yml"
      when: "ansible_action not in ['stop', 'open_ports']"

    # 2026-09-08: found that a bare-metal `prometheus` systemd service (this box's actual live
    # setup, e.g. m0) reads its config from /etc/prometheus/prometheus.yml -- a completely
    # different file from the one generated above, hand-authored once and never wired to this
    # playbook. "Restart local Prometheus service" below was therefore restarting a Prometheus
    # that never saw this repo's scrape config, rule_files, or (now) alerting: block at all. Only
    # touch /etc/prometheus if it already exists (i.e. Prometheus was set up on this host via the
    # OS/manually) -- never create it, since a host using only the docker-compose stack has no
    # such directory and should stay that way.
    - name: Check whether a bare-metal Prometheus config directory exists on this host
      ansible.builtin.stat:
        path: /etc/prometheus
      register: bare_metal_prometheus_dir
      when: "ansible_action not in ['stop', 'open_ports']"

    - name: Sync generated prometheus.yml to the bare-metal Prometheus config
      ansible.builtin.copy:
        src: "{{ project_root }}/execution/deploy/prometheus/prometheus.yml"
        dest: /etc/prometheus/prometheus.yml
        remote_src: yes
        owner: prometheus
        group: prometheus
        mode: '0644'
      become: true
      # ignore_errors (2026-09-11): same class of fix, same reason, as the alertmanager role's
      # own ignore_errors above -- this and the 2 tasks below all `become: true` (root) on
      # localhost, which fails outright with "sudo: a password is required" on a dev/test
      # machine without passwordless sudo configured. Prometheus/Alertmanager config sync is
      # monitoring infrastructure, not part of node operation -- its failure must never make
      # ansible_deploy.sh report the whole deploy as "❌ thất bại" when the actual nodes
      # (execution/consensus services) deployed fine. A real environment needing this synced
      # should configure passwordless sudo for this play instead of relying on this being
      # silently skipped.
      ignore_errors: true
      when: "ansible_action not in ['stop'] and bare_metal_prometheus_dir.stat.exists | default(false)"

    - name: Sync alert_rules.yml to the bare-metal Prometheus config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/monitoring_config/templates/alert_rules.yml.j2"
        dest: /etc/prometheus/alert_rules.yml
        owner: prometheus
        group: prometheus
        mode: '0644'
      become: true
      ignore_errors: true
      when: "ansible_action not in ['stop'] and bare_metal_prometheus_dir.stat.exists | default(false)"

    - name: Clear systemd start-limit lockout before restarting Prometheus
      # Prometheus's own unit file has no StartLimitBurst today, so this is a precaution rather
      # than a confirmed trap (unlike the metanode-execution/consensus/alertmanager case) -- kept
      # for the same reason reset-failed was added everywhere else this session: cheap, and a
      # silent no-op ('Unit ... not loaded') whenever it isn't needed.
      ansible.builtin.command: systemctl reset-failed prometheus
      become: true
      failed_when: false
      changed_when: false
      ignore_errors: true
      when: "ansible_action not in ['stop'] and bare_metal_prometheus_dir.stat.exists | default(false)"

    - name: Restart local Prometheus service
      ansible.builtin.shell: systemctl restart prometheus || true
      become: true
      args:
        executable: /bin/bash
      ignore_errors: true
      when: "ansible_action not in ['stop', 'open_ports']"
