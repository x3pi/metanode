---
# Build steps have been moved to the bash wrapper (ansible_deploy.sh) and build_release.sh.
# Ansible now always runs with prebuilt binaries (ansible_use_prebuilt=true).

- name: Check if genesis.json exists to determine if we should overwrite
  ansible.builtin.stat:
    path: "{{ cluster_config_dir }}/genesis.json"
  register: genesis_stat
  when: cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']

- name: Fail if keys already exist and overwrite not enabled (gen_keys)
  ansible.builtin.fail:
    msg: "Keys and genesis.json already exist at {{ cluster_config_dir }}. Use --overwrite to force regeneration."
  when: >
    cluster_nodes is defined and ansible_action == 'gen_keys'
    and (genesis_stat.stat.exists | default(false))
    and not (ansible_overwrite | default('false') | bool)

- name: Create isolated cluster configuration directory
  ansible.builtin.file:
    path: "{{ cluster_config_dir }}"
    state: directory
    mode: '0700'
  when: cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']

- name: Seed isolated genesis template
  ansible.builtin.copy:
    src: "{{ deploy_dir }}/genesis.json.example"
    dest: "{{ cluster_config_dir }}/genesis.json.example"
    mode: '0600'
    force: false
  when: cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']

- name: Reset validators in genesis.json on fresh setup (preserves custom alloc/accounts)
  ansible.builtin.shell: |
    python3 -c '
    import json, os
    target = "{{ cluster_config_dir }}/genesis.json"
    template = "{{ cluster_config_dir }}/genesis.json.example"
    src = target if os.path.exists(target) else template
    if os.path.exists(src):
        with open(src, "r") as f:
            data = json.load(f)
        data["validators"] = []
        with open(target, "w") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
    '
  args:
    chdir: "{{ cluster_config_dir }}"
  when: >
    cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']
    and (ansible_overwrite | default('false') | bool or not (genesis_stat.stat.exists | default(false)))

- name: Generate Validator Keys
  ansible.builtin.shell: |
    python3 "{{ deploy_dir }}/gen_validator_entry.py" \
      --hostname "node-{{ item.node_id }}" \
      --node-id "{{ item.node_id }}" \
      --chain-id "{{ chain_id | default(991) }}" \
      --install-dir "{{ metanode_install_dir }}/node-{{ item.node_id }}" \
      --tx-signature-mode "{{ tx_signature_mode | default('secp') }}" \
      --node-type "{% if item.is_synconly | default(false) %}synconly{% else %}validator{% endif %}" {% if item.is_rpc | default(false) %}--is-rpc{% endif %} {% if item.snapshot_enabled | default(false) %}--snapshot-enabled{% endif %} \
      --ip "{{ item.ip }}" \
      --total-nodes "{{ cluster_nodes | length }}" \
      --peers-map "{{ peers_map }}" \
      --snapshot-frequency-blocks "{{ snapshot_frequency_blocks | default(500) }}" \
      --snapshot-max-snapshots "{{ snapshot_max_snapshots | default(2) }}" \
      --max-part-size-mb "{{ snapshot_max_part_size_mb | default(600) }}" \
      --epoch-duration-seconds "{{ epoch_duration_seconds | default(600) }}" \
      --epochs-to-keep "{{ item.epochs_to_keep | default(0) }}" \
      --keys-dir "{{ cluster_config_dir }}/node-{{ item.node_id }}_keys" \
      --output "{{ cluster_config_dir }}/node-{{ item.node_id }}_keys/node-{{ item.node_id }}_genesis.json" \
      --metanode-bin "{% if ansible_use_prebuilt | default(false) | bool and ansible_prebuilt_bin_dir | default('') != '' %}{{ ansible_prebuilt_bin_dir }}/metanode{% else %}{{ deploy_dir }}/../../target/release/metanode{% endif %}"
  args:
    chdir: "{{ cluster_config_dir }}"
  loop: "{{ cluster_nodes }}"
  when: >
    cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']
    and (ansible_overwrite | default('false') | bool or not (genesis_stat.stat.exists | default(false)))

# `cluster_nodes`/`peers_map` are already built dynamically from inventory.yml -- see
# deploy.yml's "Local build and configuration generation" play (pre_tasks, `set_fact`), which
# always runs before this role. Nothing further to do here.
