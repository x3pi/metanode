---
# Build steps have been moved to the bash wrapper (ansible_deploy.sh) and build_release.sh.
# Ansible now always runs with prebuilt binaries (ansible_use_prebuilt=true).

- name: Check if genesis.json exists to determine if we should overwrite
  ansible.builtin.stat:
    path: "{{ deploy_dir }}/genesis.json"
  register: genesis_stat
  when: cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']

- name: Fail if keys already exist and overwrite not enabled (gen_keys)
  ansible.builtin.fail:
    msg: "Keys and genesis.json already exist at {{ deploy_dir }}. Use --overwrite to force regeneration."
  when: >
    cluster_nodes is defined and ansible_action == 'gen_keys'
    and (genesis_stat.stat.exists | default(false))
    and not (ansible_overwrite | default('false') | bool)

- name: Reset validators in genesis.json on fresh setup (preserves custom alloc/accounts)
  ansible.builtin.shell: |
    python3 -c '
    import json, os
    target = "{{ deploy_dir }}/genesis.json"
    template = "{{ deploy_dir }}/genesis.json.example"
    src = target if os.path.exists(target) else template
    if os.path.exists(src):
        with open(src, "r") as f:
            data = json.load(f)
        data["validators"] = []
        with open(target, "w") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
    '
  args:
    chdir: "{{ deploy_dir }}"
  when: >
    cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']
    and (ansible_overwrite | default('false') | bool or not (genesis_stat.stat.exists | default(false)))

- name: Generate Validator Keys
  ansible.builtin.shell: |
    python3 gen_validator_entry.py \
      --hostname "node-{{ item.node_id }}" \
      --node-id "{{ item.node_id }}" \
      --node-type "{% if item.is_synconly | default(false) %}synconly{% else %}validator{% endif %}" {% if item.is_rpc | default(false) %}--is-rpc{% endif %} {% if item.snapshot_enabled | default(false) %}--snapshot-enabled{% endif %} \
      --ip "{{ item.ip }}" \
      --total-nodes "{{ cluster_nodes | length }}" \
      --peers-map "{{ peers_map }}" \
      --snapshot-frequency-blocks "{{ snapshot_frequency_blocks | default(500) }}" \
      --snapshot-max-snapshots "{{ snapshot_max_snapshots | default(2) }}" \
      --max-part-size-mb "{{ snapshot_max_part_size_mb | default(600) }}" \
      --epoch-duration-seconds "{{ epoch_duration_seconds | default(600) }}" \
      --epochs-to-keep "{{ item.epochs_to_keep | default(0) }}" \
      --keys-dir "{{ deploy_dir }}/node-{{ item.node_id }}_keys" \
      --output "{{ deploy_dir }}/node-{{ item.node_id }}_keys/node-{{ item.node_id }}_genesis.json" \
      --metanode-bin "{% if ansible_use_prebuilt | default(false) | bool and ansible_prebuilt_bin_dir | default('') != '' %}{{ ansible_prebuilt_bin_dir }}/metanode{% else %}{{ deploy_dir }}/../../target/release/metanode{% endif %}"
  args:
    chdir: "{{ deploy_dir }}"
  loop: "{{ cluster_nodes }}"
  when: >
    cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']
    and (ansible_overwrite | default('false') | bool or not (genesis_stat.stat.exists | default(false)))

# `cluster_nodes`/`peers_map` are already built dynamically from inventory.yml -- see
# deploy.yml's "Local build and configuration generation" play (pre_tasks, `set_fact`), which
# always runs before this role. Nothing further to do here.

# RecoveryCommittee self-config (2026-09-04 -- see GatewayEngine.RecoveryCommittee's own doc
# comment and note/eurozone_unified_native_coin_plan.md): declareChainDeadWithCert/
# unregisterChainWithCert/updateCommitteeWithRecoveryCert are RecoveryCommittee-authorized and
# fail closed (VerifyQuorumCertAgainstRegistry's ErrEmptyCommittee) if this cluster's own
# cross_chain.recovery_committee_json is left unset -- which it always was until this task, since
# nothing generated it.
#
# SECURITY FIX (2026-09-04, same day, found in a follow-up security re-review): the first version
# of this task reused the Root Anchor's OWN real consensus validator authority keys as
# RecoveryCommittee -- convenient for live-verification, but a real, avoidable concentration of
# power (whoever holds >= quorum of those SAME keys both controls Root Anchor's real BFT consensus
# AND has full RecoveryCommittee authority over every other registered chain). Fixed by giving
# RecoveryCommittee its own INDEPENDENT key identity, generated once (idempotent -- reused on every
# subsequent redeploy, unlike validator keys which regenerate every `Action: setup`; see
# gen_recovery_committee_keys.py's own doc comment for why RecoveryCommittee must NOT silently
# rotate) by gen_recovery_committee_keys.py, computed into public ValidatorEntry material (real BLS
# pubkey derivation + a real Proof-of-Possession signature -- not safe to reimplement in Python) by
# the Go helper execution/cmd/tool/gen_recovery_committee. A REAL deployment should instead set
# recovery_committee_json_override_file in inventory.yml to a pre-built, operator-supplied
# (ideally air-gapped-generated) ValidatorEntry JSON file, bypassing this devnet default entirely
# -- see gen_recovery_committee_keys.py's own doc comment.
- name: Check for existing gen_recovery_committee helper
  ansible.builtin.stat:
    path: "{{ (ansible_prebuilt_bin_dir + '/gen_recovery_committee') if (ansible_use_prebuilt | default(false) | bool and ansible_prebuilt_bin_dir | default('') != '') else (deploy_dir + '/../../execution/gen_recovery_committee') }}"
  register: recovery_committee_helper_stat
  when: cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']

- name: Build gen_recovery_committee helper
  ansible.builtin.shell: |
    cd "{{ deploy_dir }}/../../execution" && go build -o gen_recovery_committee ./cmd/tool/gen_recovery_committee
  args:
    chdir: "{{ deploy_dir }}"
    creates: "{{ deploy_dir }}/../../execution/gen_recovery_committee"
  # In the new workflow, wrapper handles compiling it if missing, but we keep this as a fallback if not prebuilt
  when: cluster_nodes is defined and ansible_action in ['setup', 'gen_keys'] and not (recovery_committee_helper_stat.stat.exists | default(false)) and not (ansible_use_prebuilt | default(false) | bool)

- name: Ensure independent RecoveryCommittee keys exist (idempotent -- devnet default only)
  ansible.builtin.shell: |
    python3 gen_recovery_committee_keys.py --out-dir "{{ deploy_dir }}/recovery_committee_keys" --metanode-bin "{% if ansible_use_prebuilt | default(false) | bool and ansible_prebuilt_bin_dir | default('') != '' %}{{ ansible_prebuilt_bin_dir }}/metanode{% else %}{{ deploy_dir }}/../../target/release/metanode{% endif %}" --count "{{ recovery_committee_size | default(4) }}"
  args:
    chdir: "{{ deploy_dir }}"
  when: cluster_nodes is defined and ansible_action in ['setup', 'gen_keys'] and (recovery_committee_json_override_file is not defined or recovery_committee_json_override_file == '')

- name: Compute and inject RecoveryCommittee config into every node's execution.json
  ansible.builtin.shell: |
    helper_bin="{% if recovery_committee_helper_stat.stat.exists | default(false) %}{{ recovery_committee_helper_stat.stat.path }}{% else %}{{ deploy_dir }}/../../execution/gen_recovery_committee{% endif %}"
    python3 inject_recovery_committee.py "{{ deploy_dir }}" "{{ cluster_nodes | length }}" "$helper_bin" "{{ deploy_dir }}/recovery_committee_keys" {% if recovery_committee_json_override_file is defined and recovery_committee_json_override_file != '' %}--override-file "{{ recovery_committee_json_override_file }}"{% endif %}
  args:
    chdir: "{{ deploy_dir }}"
  when: cluster_nodes is defined and ansible_action in ['setup', 'gen_keys']
