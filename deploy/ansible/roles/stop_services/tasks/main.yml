---
- name: Stop any running monitoring processes on the node
  ansible.builtin.shell: |
    pkill -9 -f 'start_monitors.sh' || true
    pkill -9 -f 'block_hash_checker' || true
  failed_when: false
  changed_when: false

- name: Find all metanode services
  ansible.builtin.shell: "systemctl list-unit-files | grep -E '^metanode-.*\\.service' | awk '{print $1}'"
  register: all_metanode_services
  changed_when: false
  failed_when: false

- name: Stop and disable all metanode services to prevent rogue nodes
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop: "{{ all_metanode_services.stdout_lines }}"
  when: all_metanode_services.stdout_lines | length > 0
  failed_when: false

- name: Check if metanode or simple_chain processes are still running
  ansible.builtin.shell: "pgrep -x metanode || pgrep -x simple_chain || pgrep -x rpc-client-bin"
  register: process_check
  failed_when: false
  changed_when: false

- name: Send SIGTERM to remaining processes to allow graceful shutdown
  ansible.builtin.shell: |
    pkill -15 -x metanode || true
    pkill -15 -x simple_chain || true
    pkill -15 -x rpc-client-bin || true
  when: process_check.rc == 0
  failed_when: false

- name: Wait 10 seconds for graceful database flush
  ansible.builtin.pause:
    seconds: 10
  when: process_check.rc == 0

- name: Force kill any stubborn Consensus processes (SIGKILL)
  ansible.builtin.shell: "pkill -9 -x metanode || true"
  failed_when: false

- name: Force kill any stubborn Execution processes (SIGKILL)
  ansible.builtin.shell: "pkill -9 -x simple_chain || true"
  failed_when: false

- name: Force kill any stubborn RPC processes (SIGKILL)
  ansible.builtin.shell: "pkill -9 -x rpc-client-bin || true"
  failed_when: false
