---
# 2026-09-08: metanode-execution.service.j2 (and metanode-consensus.service.j2) now set
# StartLimitIntervalSec=300/StartLimitBurst=5 (crash-loop circuit breaker). Once tripped,
# `systemctl restart` on the unit fails with "Start request repeated too quickly" -- confirmed
# empirically that a plain restart is NOT enough to clear it, unlike a normal restart of a
# healthy unit. `failed_when: false` below was already silently swallowing that failure before
# this fix, so a node stuck in the tripped state looked "restarted OK" while staying down. Clear
# the lockout for every service class before restarting; harmless no-op on any unit that never
# failed.
- name: Clear systemd start-limit lockout before restarting (RPC Proxy)
  ansible.builtin.command: "systemctl reset-failed metanode-rpc-{{ item }}"
  loop: "{{ active_nodes }}"
  failed_when: false
  changed_when: false

- name: Restart RPC Proxy services
  ansible.builtin.systemd:
    name: "metanode-rpc-{{ item }}"
    state: restarted
  loop: "{{ active_nodes }}"
  failed_when: false

- name: Clear systemd start-limit lockout before restarting (Execution)
  ansible.builtin.command: "systemctl reset-failed metanode-execution-{{ item }}"
  loop: "{{ active_nodes }}"
  failed_when: false
  changed_when: false

- name: Restart Execution services
  ansible.builtin.systemd:
    name: "metanode-execution-{{ item }}"
    state: restarted
  loop: "{{ active_nodes }}"
  failed_when: false

- name: Clear systemd start-limit lockout before restarting (Consensus)
  ansible.builtin.command: "systemctl reset-failed metanode-consensus-{{ item }}"
  loop: "{{ active_nodes }}"
  failed_when: false
  changed_when: false

- name: Restart Consensus services
  ansible.builtin.systemd:
    name: "metanode-consensus-{{ item }}"
    state: restarted
  loop: "{{ active_nodes }}"
  failed_when: false
