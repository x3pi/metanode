---
- name: Ensure base deployment directory exists
  ansible.builtin.file:
    path: "{{ remote_deploy_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Create node data and log directories
  ansible.builtin.file:
    path: "{{ metanode_install_dir }}/node-{{ item[0] }}/{{ item[1] }}"
    state: directory
    owner: metanode
    group: metanode
    mode: '0755'
  loop: "{{ active_nodes | product(['data', 'logs']) | list }}"
  ignore_errors: true # In case metanode user doesn't exist yet, it's fine

- name: Unarchive release tarball
  ansible.builtin.unarchive:
    src: "{{ project_root }}/metanode-deploy.tar.gz"
    dest: "{{ remote_deploy_dir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
    extra_opts: ['--strip-components=1']

- name: Copy keys for each node to remote
  # mode/directory_mode tightened from 0755 (found 2026-08-27 during a config-security
  # review): this directory holds raw private keys (execution.json's private_key, BLS
  # authority_key.json, eth_key.json, etc.) and 0755 made every one of them world-readable
  # to any local account on the server, not just the deploying user. Ansible runs this
  # task (and the later remote_src copy out of this staging dir in systemd_services) as
  # root via `become: yes`, which ignores these permission bits entirely, so 0600/0700
  # changes nothing about whether the deploy itself still works.
  ansible.builtin.copy:
    src: "{{ deploy_dir }}/node-{{ item }}_keys/"
    dest: "{{ remote_deploy_dir }}/node-{{ item }}_keys/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
    directory_mode: '0700'
  loop: "{{ active_nodes }}"
  when: ansible_action == 'setup'

- name: Extract node configuration for snapshot evaluation
  set_fact:
    node_configs: >-
      {%- set configs = {} -%}
      {%- for nid in active_nodes -%}
        {%- for node in hostvars['localhost']['cluster_nodes'] -%}
          {%- if node.node_id | string == nid | string -%}
            {%- set _ = configs.update({nid | string: node}) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ configs }}

- name: Determine if current host requires BTRFS for snapshots
  set_fact:
    host_requires_btrfs: >-
      {%- set needed = false -%}
      {%- for nid in active_nodes -%}
        {%- if node_configs[nid | string].snapshot_enabled | default(false) -%}
          {%- set needed = true -%}
        {%- endif -%}
      {%- endfor -%}
      {{ needed }}

- name: Auto-detect BTRFS device path for /opt/metanode
  ansible.builtin.shell: |
    fstype=$(findmnt -n -o FSTYPE /opt/metanode 2>/dev/null || true)
    dev=""
    if [ "$fstype" = "btrfs" ]; then
      dev=$(findmnt -n -o SOURCE /opt/metanode 2>/dev/null || true)
    fi
    if [ -z "$dev" ]; then
      snap_fstype=$(findmnt -n -o FSTYPE /mnt/metanode_snapshots 2>/dev/null || true)
      if [ "$snap_fstype" = "btrfs" ]; then
        dev=$(findmnt -n -o SOURCE /mnt/metanode_snapshots 2>/dev/null || true)
      fi
    fi
    if [ -z "$dev" ]; then
      dev=$(awk '$2 == "/opt/metanode" && $3 == "btrfs" {print $1}' /etc/fstab 2>/dev/null || true)
    fi
    if [ -z "$dev" ]; then
      dev=$(awk '$2 == "/mnt/metanode_snapshots" && $3 == "btrfs" {print $1}' /etc/fstab 2>/dev/null || true)
    fi
    case "$dev" in
      /dev/loop*)
        backing=$(losetup -n -O BACK-FILE "$dev" 2>/dev/null || true)
        if [ -n "$backing" ] && [ -f "$backing" ]; then
          dev="$backing"
        else
          dev=""
        fi
        ;;
      *)
        if [ -n "$dev" ] && [ ! -b "$dev" ] && [ ! -f "$dev" ]; then
          dev=""
        fi
        ;;
    esac
    if [ -z "$dev" ] && [ -f "/opt/metanode_cluster_btrfs.img" ]; then
      dev="/opt/metanode_cluster_btrfs.img"
    fi
    echo "$dev"
  args:
    executable: /bin/bash
  register: detected_btrfs_dev
  changed_when: false

- name: Set btrfs_device_path dynamically if detected
  set_fact:
    btrfs_device_path: "{{ detected_btrfs_dev.stdout }}"
  when: detected_btrfs_dev.stdout != ""

- name: Check if BTRFS partition exists
  ansible.builtin.stat:
    path: "{{ btrfs_device_path | default('/dev/mapper/ubuntu--vg-metanode_data') }}"
    get_checksum: false
    get_mime: false
  register: btrfs_disk

- name: Check available disk space before BTRFS initialization
  ansible.builtin.shell: |
    python3 - <<'EOF'
    import sys, shutil, re, subprocess, os

    req_str = "{{ btrfs_size | default(hostvars[groups['metanode_cluster'][0]]['btrfs_size'] | default('400G')) }}".strip()
    units = {"K": 1024, "M": 1024**2, "G": 1024**3, "T": 1024**4}
    m = re.match(r"^(\d+(?:\.\d+)?)\s*([KMGT])?B?$", req_str, re.IGNORECASE)
    if not m:
        print(f"INVALID_FORMAT:{req_str}")
        sys.exit(1)

    val = float(m.group(1))
    unit = (m.group(2) or "G").upper()
    req_bytes = int(val * units[unit])
    req_gb = round(req_bytes / (1024**3), 2)

    # Check LVM free space
    lvm_bytes = 0
    has_lvm = False
    try:
        res = subprocess.run(["vgs", "--noheadings", "-o", "vg_free", "--units", "b", "--nosuffix", "ubuntu-vg"],
                             capture_output=True, text=True)
        if res.returncode == 0 and res.stdout.strip():
            has_lvm = True
            lvm_bytes = int(float(res.stdout.strip().split()[0]))
    except Exception:
        pass

    # Check filesystem free space for loop file
    target = "/opt"
    check_dir = target if os.path.exists(target) else "/"
    stat = shutil.disk_usage(check_dir)
    free_bytes = stat.free
    free_gb = round(free_bytes / (1024**3), 2)

    if has_lvm and lvm_bytes >= req_bytes:
        print(f"OK:LVM:{req_gb}:{round(lvm_bytes / (1024**3), 2)}")
        sys.exit(0)
    elif free_bytes >= req_bytes:
        print(f"OK:LOOP:{req_gb}:{free_gb}")
        sys.exit(0)
    else:
        max_avail = max(lvm_bytes, free_bytes)
        avail_gb = round(max_avail / (1024**3), 2)
        print(f"ERR_INSUFFICIENT:{req_gb}:{avail_gb}:{check_dir}")
        sys.exit(2)
    EOF
  args:
    executable: /bin/bash
  register: disk_space_check
  failed_when: false
  changed_when: false
  when: >
    host_requires_btrfs | bool
    and not btrfs_disk.stat.exists
    and (fs_type.stdout | default('unknown') not in ['btrfs', 'xfs'])

- name: Fail if requested BTRFS size format is invalid
  ansible.builtin.fail:
    msg: |
      ❌ [LỖI CẤU HÌNH DUNG LƯỢNG SNAPSHOT]
      Máy chủ '{{ inventory_hostname }}' ({{ ansible_host | default('') }}) có giá trị 'btrfs_size' không đúng định dạng:
      '{{ disk_space_check.stdout.split(':')[1] | default(btrfs_size | default('400G')) }}'
      👉 Định dạng hợp lệ: số + đơn vị K/M/G/T (ví dụ: 100G, 500G, 1T, 2T). Vui lòng sửa lại biến 'btrfs_size' trong inventory.yml.
  when: >
    host_requires_btrfs | bool
    and not btrfs_disk.stat.exists
    and (fs_type.stdout | default('unknown') not in ['btrfs', 'xfs'])
    and disk_space_check.rc == 1

- name: Fail if requested BTRFS size exceeds available disk space
  ansible.builtin.fail:
    msg: |
      ❌ [LỖI CẤU HÌNH DUNG LƯỢNG SNAPSHOT]
      Máy chủ '{{ inventory_hostname }}' ({{ ansible_host | default('') }}) cần bật tính năng Snapshot,
      nhưng dung lượng btrfs_size cấu hình là '{{ btrfs_size | default(hostvars[groups['metanode_cluster'][0]]['btrfs_size'] | default('400G')) }}' ({{ disk_space_check.stdout.split(':')[1] }} GB)
      VƯỢT QUÁ dung lượng ổ cứng còn trống hiện tại (chỉ còn {{ disk_space_check.stdout.split(':')[2] }} GB)!
      👉 Hướng dẫn khắc phục:
         Vui lòng mở file inventory.yml chỉnh lại biến 'btrfs_size' nhỏ hơn (ví dụ: btrfs_size: '{{ (disk_space_check.stdout.split(':')[2] | float * 0.8) | int }}G')
         hoặc chạy ./ansible_deploy.sh với cờ --btrfs-size {{ (disk_space_check.stdout.split(':')[2] | float * 0.8) | int }}G!
  when: >
    host_requires_btrfs | bool
    and not btrfs_disk.stat.exists
    and (fs_type.stdout | default('unknown') not in ['btrfs', 'xfs'])
    and disk_space_check.rc == 2

- name: Ensure btrfs-progs is installed on snapshot host
  ansible.builtin.apt:
    name: btrfs-progs
    state: present
    update_cache: false
  when: >
    host_requires_btrfs | bool
    and not btrfs_disk.stat.exists
    and (fs_type.stdout | default('unknown') not in ['btrfs', 'xfs'])

- name: Automatically initialize BTRFS partition or sparse loopback image
  # Mirrors deploy/systemd/cluster/setup-cluster-btrfs.sh's LVM-vs-loopback logic (including its
  # existing-LV reuse check) so the Ansible-driven path and the manual/systemd path don't drift.
  # Every fallback branch logs an explicit WARN (to stderr, so it doesn't pollute the stdout this
  # task's caller parses as the resulting device path) instead of failing/falling back silently.
  ansible.builtin.shell: |
    set -e
    target_size="{{ btrfs_size | default(hostvars[groups['metanode_cluster'][0]]['btrfs_size'] | default('400G')) }}"
    btrfs_img="/opt/metanode_cluster_btrfs.img"
    created_dev=""
    use_loopback=false

    if sudo vgs ubuntu-vg >/dev/null 2>&1; then
      if sudo lvs ubuntu-vg/metanode_data >/dev/null 2>&1; then
        echo "WARN: LV ubuntu-vg/metanode_data already exists, reusing it instead of lvcreate" >&2
        created_dev="/dev/ubuntu-vg/metanode_data"
      else
        lvcreate_err=$(sudo lvcreate -L "$target_size" -n metanode_data ubuntu-vg 2>&1 >/dev/null) || {
          echo "WARN: lvcreate failed, falling back to loopback file. lvcreate said: ${lvcreate_err}" >&2
          use_loopback=true
        }
        [ "$use_loopback" != true ] && created_dev="/dev/ubuntu-vg/metanode_data"
      fi
    else
      echo "WARN: LVM volume group 'ubuntu-vg' not found, using loopback file" >&2
      use_loopback=true
    fi

    if [ "$use_loopback" = true ] || [ -z "$created_dev" ]; then
      created_dev="$btrfs_img"
      mkdir -p /opt
      truncate -s "$target_size" "$btrfs_img"
    fi

    mkfs.btrfs -f "$created_dev" >&2
    echo "$created_dev"
  args:
    executable: /bin/bash
  register: auto_btrfs_init
  when: >
    host_requires_btrfs | bool
    and not btrfs_disk.stat.exists
    and (fs_type.stdout | default('unknown') not in ['btrfs', 'xfs'])

- name: Update BTRFS facts after auto initialization
  set_fact:
    btrfs_device_path: "{{ auto_btrfs_init.stdout.strip() }}"
    btrfs_disk:
      stat:
        exists: true
  when:
    - auto_btrfs_init is defined
    - auto_btrfs_init.stdout is defined
    - auto_btrfs_init.stdout.strip() != ""

- name: Unmount all existing node data bind mounts before resetting
  ansible.builtin.shell: |
    for d in /opt/metanode/node-*/data; do
      if mountpoint -q "$d"; then
        umount "$d" || umount -l "$d" || true
      fi
    done
  changed_when: false

- name: Unmount /opt/metanode if it is mounted to BTRFS disk
  ansible.builtin.shell: |
    if mount | grep -q 'on /opt/metanode type btrfs'; then
      umount /opt/metanode || umount -l /opt/metanode || true
    fi
    sed -i '\#{{ btrfs_device_path | default('/dev/mapper/ubuntu--vg-metanode_data') }} /opt/metanode#d' /etc/fstab
  when: btrfs_disk.stat.exists
  changed_when: false

- name: Ensure base snapshot mount directory exists
  ansible.builtin.file:
    path: /mnt/metanode_snapshots
    state: directory
    mode: '0755'
  when: btrfs_disk.stat.exists

- name: Mount BTRFS partition to /mnt/metanode_snapshots (shell)
  ansible.builtin.shell: |
    if ! mountpoint -q /mnt/metanode_snapshots; then
      mount -t btrfs -o "{{ 'loop,defaults' if '.img' in (btrfs_device_path | default('')) else 'defaults' }}" "{{ btrfs_device_path | default('/dev/mapper/ubuntu--vg-metanode_data') }}" /mnt/metanode_snapshots
    fi
  when: btrfs_disk.stat.exists

- name: Persist BTRFS partition in /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "{{ btrfs_device_path | default('/dev/mapper/ubuntu--vg-metanode_data') }} /mnt/metanode_snapshots btrfs {{ 'loop,defaults' if '.img' in (btrfs_device_path | default('')) else 'defaults' }} 0 0"
    regexp: "^.* /mnt/metanode_snapshots "
    state: present
  when: btrfs_disk.stat.exists


- name: Validate BTRFS availability for snapshot-enabled nodes
  ansible.builtin.fail:
    msg: |
      [CẢNH BÁO / LỖI DEPLOY] Node {{ item }} được cấu hình snapshot (snapshot_enabled: true),
      nhưng không tìm thấy phân vùng hoặc file BTRFS (btrfs_device_path: '{{ btrfs_device_path | default("") }}')
      và thư mục cài đặt {{ metanode_install_dir }} (fs_type: '{{ fs_type.stdout | default("unknown") }}') không nằm trên hệ thống tệp BTRFS/XFS.
      Node sẽ bị crash khi runtime nếu tiếp tục.
      Hướng dẫn khắc phục: Vui lòng cấu hình phân vùng BTRFS (hoặc tạo file loop /opt/metanode_cluster_btrfs.img) trước khi deploy, hoặc tắt snapshot.
  loop: "{{ active_nodes }}"
  when: >
    node_configs[item | string].snapshot_enabled
    and not btrfs_disk.stat.exists
    and (fs_type.stdout | default('unknown') not in ['btrfs', 'xfs'])
- name: Create bind mount source directories for snapshot-enabled nodes
  ansible.builtin.file:
    path: "/mnt/metanode_snapshots/node-{{ item }}"
    state: directory
    owner: metanode
    group: metanode
    mode: '0755'
  loop: "{{ active_nodes }}"
  when: btrfs_disk.stat.exists and node_configs[item | string].snapshot_enabled
  ignore_errors: true

- name: Ensure the entire snapshot source subtree is owned by metanode, not just its top dir
  # The task above only chowns /mnt/metanode_snapshots/node-N itself (also ignore_errors, so a
  # transient failure there silently leaves even that top dir un-chowned). Content further down
  # the subtree -- created by root-context steps (mkfs.btrfs's root-owned volume root, or a
  # previous run's own root-owned leftovers, since btrfs COW snapshots/reflinks can carry an
  # old owner forward) -- stays root:root and is invisible to a top-level, non-recursive chown.
  # The service runs as user "metanode" (see systemd unit), so anything it needs to open/create
  # under here (e.g. execution/backup/consensus/backup_db/LOCK) must actually be writable by
  # that user, all the way down -- not just at the mount point. Reproduced live: a fresh
  # --reset-all left execution/backup/consensus/backup_db root-owned while its metanode-owned
  # parent "backup" dir looked fine, and PebbleDB failed to open the LOCK file with "permission
  # denied" on next start, crash-looping the snapshot node. Recursive and idempotent -- safe to
  # run on every deploy regardless of whether this run actually needed it.
  ansible.builtin.file:
    path: "/mnt/metanode_snapshots/node-{{ item }}"
    state: directory
    recurse: yes
    owner: metanode
    group: metanode
  loop: "{{ active_nodes }}"
  when: btrfs_disk.stat.exists and node_configs[item | string].snapshot_enabled
  ignore_errors: true

- name: Create execution snapshot target directories
  ansible.builtin.file:
    path: "{{ metanode_install_dir }}/node-{{ item }}/data"
    state: directory
    owner: metanode
    group: metanode
    mode: '0755'
  loop: "{{ active_nodes }}"
  when: btrfs_disk.stat.exists
  ignore_errors: true

- name: Setup Bind Mounts for snapshot-enabled nodes
  ansible.builtin.mount:
    path: "{{ metanode_install_dir }}/node-{{ item }}/data"
    src: "/mnt/metanode_snapshots/node-{{ item }}"
    opts: bind
    fstype: none
    state: mounted
  loop: "{{ active_nodes }}"
  when: btrfs_disk.stat.exists and node_configs[item | string].snapshot_enabled

- name: Remove Bind Mounts for non-snapshot nodes
  ansible.builtin.shell: |
    if mount | grep -q "on {{ metanode_install_dir }}/node-{{ item }}/data type"; then
      umount "{{ metanode_install_dir }}/node-{{ item }}/data" || true
    fi
    sed -i '\#{{ metanode_install_dir }}/node-{{ item }}/data#d' /etc/fstab
  loop: "{{ active_nodes }}"
  when: btrfs_disk.stat.exists and not node_configs[item | string].snapshot_enabled
  changed_when: false

# ═══════════════════════════════════════════════════════════════════════════
# SMOKE TESTS (2026-09-09): both regression tests for real bugs found live on this
# exact host class (multiple co-located nodes + BTRFS snapshot nodes). They run
# BEFORE systemd_services starts any process, so a bad deploy fails loud and fast
# here instead of surfacing 10+ minutes later as a crash-loop or a snapshot that
# silently never gets served.
# ═══════════════════════════════════════════════════════════════════════════

- name: "SMOKE TEST: check whether /opt/metanode itself got mounted"
  # deploy/systemd/cluster/setup-cluster-btrfs.sh (the standalone manual/systemd deploy
  # script) intentionally mounts BTRFS onto the whole metanode_install_dir -- correct for
  # that flow, but wrong here: this Ansible role's own architecture mounts BTRFS only at
  # /mnt/metanode_snapshots plus per-node bind mounts (see tasks above), leaving
  # metanode_install_dir itself as a plain directory shared by ALL nodes. If anything
  # mounts something directly onto it, every node's already-deployed bin/config/keys gets
  # shadowed by whatever that mount's root contains. Reproduced live: node binaries became
  # "No such file or directory" immediately after a stray call to that script ran mid-play.
  ansible.builtin.shell: mountpoint -q "{{ metanode_install_dir }}" && echo MOUNTED || echo OK
  register: opt_metanode_mount_check
  changed_when: false
  failed_when: false

- name: Fail if metanode_install_dir itself is mounted (shadows every node's files)
  ansible.builtin.fail:
    msg: |
      ❌ [LỖI MOUNT] '{{ metanode_install_dir }}' (thư mục cha chứa TẤT CẢ các node) đang là
      một mount point riêng -- điều này che khuất bin/config/keys của mọi node bên dưới.
      👉 Chỉ '/mnt/metanode_snapshots' và các bind-mount riêng từng node
      ('{{ metanode_install_dir }}/node-N/data') mới được phép mount. Kiểm tra lại xem có
      script nào (vd deploy/systemd/cluster/setup-cluster-btrfs.sh) vừa mount đè lên
      '{{ metanode_install_dir }}' không, rồi `umount` nó trước khi deploy tiếp.
  when: opt_metanode_mount_check.stdout | trim == 'MOUNTED'

- name: "SMOKE TEST: check every active node's data dir for files not owned by metanode"
  # The service runs as user "metanode" (see the systemd unit), so anything it needs to
  # open/create must be writable by that user all the way down its directory tree -- not
  # just at the top. Root-context steps (mkfs.btrfs's root-owned volume root, a btrfs COW
  # snapshot/reflink carrying an old owner forward, a non-recursive chown further up)
  # leave stragglers invisible to anything less than a full recursive scan. Reproduced
  # live: a snapshot node ran fine for 30+ minutes, then on its next restart PebbleDB
  # failed to open execution/backup/consensus/backup_db/LOCK with "permission denied" --
  # that one subdirectory was root-owned despite its parent looking fine.
  ansible.builtin.shell: |
    find "{{ metanode_install_dir }}/node-{{ item }}/data" -not -user metanode 2>/dev/null | head -5
  loop: "{{ active_nodes }}"
  register: ownership_smoke_check
  changed_when: false
  failed_when: false

- name: Fail deploy if any node's data directory has files not owned by metanode
  ansible.builtin.fail:
    msg: |
      ❌ [LỖI QUYỀN SỞ HỮU] Node {{ item.item }}: tìm thấy file/thư mục KHÔNG thuộc sở hữu
      user 'metanode' dưới {{ metanode_install_dir }}/node-{{ item.item }}/data -- service
      chạy bằng user 'metanode' sẽ không mở/ghi được các file này khi khởi động.
      Ví dụ: {{ item.stdout_lines | join(', ') }}
      👉 Nguyên nhân thường gặp: một bước chạy với quyền root (mkfs.btrfs, script khác) tạo
      ra các file/thư mục này mà không chown lại đệ quy. Kiểm tra lại các bước
      BTRFS/bind-mount phía trên trong role này.
  loop: "{{ ownership_smoke_check.results }}"
  loop_control:
    label: "node-{{ item.item }}"
  when: item.stdout | trim != ''
