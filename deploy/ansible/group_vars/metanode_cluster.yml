# Overrides for the metanode_cluster group specifically. Ansible variable precedence puts
# "group_vars/<named-group>.yml" ABOVE "group_vars/all.yml" (found live 2026-09-04: an override
# set as inline `vars:` inside inventory.yml's metanode_cluster block was silently shadowed by
# group_vars/all.yml's empty default -- inline inventory group vars rank BELOW playbook
# group_vars/all in ansible's precedence order, the opposite of what's intuitive). This file is
# the correct place for any override that must actually win over all.yml's devnet defaults.
