---
project_root: "{{ playbook_dir }}/../.."
deploy_dir: "{{ project_root }}/deploy/systemd"
remote_deploy_dir: "/opt/metanode-deploy"
metanode_install_dir: "/opt/metanode"

# Operational configuration defaults
ansible_action: "start"      # 'start' or 'stop'
target_node: "all"           # 'all' or specific node id (e.g. 2)
keep_data: true              # true or false
restore_node: "none"         # 'none' or specific node id (e.g. 2)
snapshot_url: ""             # e.g., 'http://192.168.1.230:8604'

# Snapshot and Epoch configuration defaults (matches inventory.yml defaults)
epoch_duration_seconds: 60
snapshot_frequency_blocks: 50
snapshot_max_snapshots: 2
snapshot_max_part_size_mb: 600
epochs_to_keep: 0
snapshot_server_port: 8604

# RecoveryCommittee (2026-09-04 -- see GatewayEngine.RecoveryCommittee's own doc comment,
# execution/pkg/cross_chain/gateway.go, and deploy/ansible/roles/local_build/tasks/main.yml's
# "Ensure independent RecoveryCommittee keys exist" task). Devnet default: this cluster
# auto-generates its own independent RecoveryCommittee key set (never reuses Root Anchor's own
# consensus validator keys -- that reuse was a real security finding, fixed 2026-09-04).
recovery_committee_size: 4
# For a REAL (non-devnet) deployment, set this to an absolute path to a pre-built, operator-
# supplied []cross_chain.ValidatorEntry JSON file (pubkey + PopSignature ONLY -- never a private
# key) instead -- generate RecoveryCommittee's real keys entirely out-of-band (ideally on
# air-gapped hardware, one member per distinct physical custodian) and never let this repo's
# tooling see the private key material at all. Leave empty to use the devnet auto-generated
# default above.
recovery_committee_json_override_file: ""

# Signature & nonce verification in mempool (false = strictly verified, true = bypass for raw benchmark stress-test)
skip_mempool_sig_verify: false

# Device key verification (false = disabled/default, true = enabled)
verify_device_key: false
