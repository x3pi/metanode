[package]
name = "metanode-tee-revm"
version = "0.1.0"
edition = "2024"

[dependencies]
revm = { version = "14.0.0", default-features = false }
revm-primitives = { version = "10.0.0", default-features = false }
blake3 = { version = "1.5", default-features = false }
nomt-core = { git = "https://github.com/thrumdev/nomt.git", default-features = false, features = ["blake3-hasher", "serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
bincode = { version = "1.3.3" }
bitvec = { version = "1.0", default-features = false }

[dev-dependencies]
tantivy = "0.22"
tempfile = "3.10"
hex = "0.4"
nomt = { git = "https://github.com/thrumdev/nomt.git", features = ["blake3-hasher"] }
[features]
default = ["std"]
std = [
    "revm/std",
    "revm-primitives/std",
    "blake3/std",
    "nomt-core/std",
    "serde/std",
]
