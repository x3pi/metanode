[package]
name = "metanode-keytool"
version = "0.1.0"
edition = "2024"
publish = false
description = "CLI tool to generate BLS, Ed25519, and ETH keys for Metanode validators"

[[bin]]
name = "metanode-keytool"
path = "src/main.rs"

[lib]
name = "metanode_keytool"
path = "src/lib.rs"

[dependencies]
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "4db0e90c732bbf7420ca20de808b698883148d9c", features = ["copy_key"] }
rand       = "0.8.5"
serde      = { version = "1.0.144", features = ["derive"] }
serde_json = "1"
hex        = "0.4"
clap       = { version = "4", features = ["derive"] }
anyhow     = "1.0.71"
# For ETH address derivation: keccak256(uncompressed_pubkey[1..])
tiny-keccak = { version = "2.0", features = ["keccak"] }
