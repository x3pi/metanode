---
project_root: "{{ playbook_dir }}/.."
deploy_dir: "{{ project_root }}/deploy_systemd"
remote_deploy_dir: "/opt/metanode-deploy"
metanode_install_dir: "/opt/metanode"

# Operational configuration defaults
ansible_action: "start"      # 'start' or 'stop'
target_node: "all"           # 'all' or specific node id (e.g. 2)
keep_data: true              # true or false
restore_node: "none"         # 'none' or specific node id (e.g. 2)
snapshot_url: ""             # e.g., 'http://192.168.1.230:8604'

# Ports and configurations can be added here if needed
snapshot_server_port: 8604
